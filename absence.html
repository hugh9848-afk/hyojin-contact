<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>결석 전달 · 효진외국어학원</title>

<script>
/* ═══════════════════════════════════════════════════════════
   ↓↓↓ 여기 한 줄만 고치면 됩니다 ↓↓↓
   구글 스크립트 편집기 → 배포 → 배포 관리 에 나오는
   웹 앱 URL 을 그대로 따옴표 안에 붙여넣으세요.
   (뒤에 ?p=absence 같은 건 붙이지 마세요)
   ═══════════════════════════════════════════════════════════ */
var API = "https://script.google.com/macros/s/AKfycbwxAAzyWCJzwKEz_tK8XK2dHY16sWn_OVPfjYdS-iEeLll5d3U4nyf0-XfEtr1CsSHv/exec";
</script>

<style>
  *{box-sizing:border-box}
  body{margin:0;padding:20px 16px 48px;background:#f6f7f9;color:#1a1a1a;
       font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
       line-height:1.5}
  .wrap{max-width:460px;margin:0 auto}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:#666;font-size:14px;margin:0 0 20px}
  .card{background:#fff;border-radius:14px;padding:18px 16px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  label{display:block;font-weight:700;font-size:14px;margin:16px 0 6px}
  label:first-of-type{margin-top:0}
  select,input,textarea{width:100%;padding:12px;font-size:16px;border:1px solid #d5d8dd;
       border-radius:9px;background:#fff;font-family:inherit}
  select:disabled{background:#f2f3f5;color:#999}
  textarea{min-height:76px;resize:vertical}
  button{width:100%;margin-top:22px;padding:15px;font-size:17px;font-weight:700;color:#fff;
       background:#2f6fdb;border:0;border-radius:10px;cursor:pointer;font-family:inherit}
  button:disabled{background:#b9c4d4;cursor:default}
  .hint{font-size:13px;color:#777;margin-top:6px}
  .err{color:#c0392b;font-size:14px;margin-top:12px;min-height:20px}
  .done{text-align:center;padding:26px 8px}
  .done .big{font-size:44px}
  .done h2{font-size:19px;margin:10px 0 14px}
  .box{background:#f3f6fb;border-radius:10px;padding:14px;text-align:left;font-size:15px}
  .box div{margin:4px 0}
  .box b{display:inline-block;min-width:64px;color:#555;font-weight:600}
  .warn{background:#fff6e5;color:#7a4b00;border-radius:10px;padding:12px;font-size:14px;margin-top:12px}
  .guide{margin-top:18px;padding:15px 16px;background:#f3f6fb;border-radius:10px;
       text-align:left;font-size:14.5px;line-height:1.7;color:#33415c}
  .guide b{color:#1a2740}
  .retry{background:#fff;color:#2f6fdb;border:1px solid #2f6fdb;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>결석 전달 · 수업영상 요청</h1>
  <p class="sub">효진외국어학원</p>

  <div class="card" id="form">
    <label for="cls">반</label>
    <select id="cls" disabled><option value="">불러오는 중…</option></select>

    <label for="date">결석 예정일</label>
    <select id="date" disabled><option value="">반을 먼저 선택하세요</option></select>

    <label for="stu">학생 이름</label>
    <select id="stu" disabled><option value="">반을 먼저 선택하세요</option></select>
    <input id="stuOther" style="display:none;margin-top:8px" placeholder="학생 이름을 적어주세요">

    <label for="reason">사유 <span style="font-weight:400;color:#888">(선택)</span></label>
    <textarea id="reason" maxlength="200" placeholder="예) 학교 행사로 참석이 어렵습니다"></textarea>

    <div class="err" id="err"></div>
    <button id="go" disabled>결석 전달하기</button>
    <button id="again" class="retry" style="display:none">다시 불러오기</button>
  </div>

  <div class="card done" id="done" style="display:none">
    <div class="big">✅</div>
    <h2>전달되었습니다</h2>
    <div class="box" id="summary"></div>
    <div id="extra"></div>
    <div class="guide">
      담당선생님께 전달 되었습니다.<br><br>
      영상은 밴드를 통해 학생에게 직접 전달되며 자료는
      <b>토,일 오전 10시~오후 9시</b> 사이에 학원 데스크에서 찾아가실 수 있습니다.<br><br>
      감사합니다
    </div>
  </div>
</div>

<script>
(function () {
  var DATA = null;
  var DOW  = ['일','월','화','수','목','금','토'];
  var $ = function (id) { return document.getElementById(id); };
  var cls = $('cls'), date = $('date'), stu = $('stu'), other = $('stuOther'),
      go = $('go'), err = $('err'), again = $('again');

  /* ── 구글 스크립트와 이야기하는 부분 ─────────────────── */
  var seq = 0;
  function ask(params, ok, fail) {
    var name = '__abs_cb_' + (++seq);
    var s = document.createElement('script'), timer;
    function cleanup() {
      clearTimeout(timer);
      try { delete window[name]; } catch (e) { window[name] = undefined; }
      if (s.parentNode) s.parentNode.removeChild(s);
    }
    window[name] = function (res) { cleanup(); ok(res); };
    s.onerror = function () { cleanup(); fail(new Error('연결하지 못했습니다')); };
    timer = setTimeout(function () { cleanup(); fail(new Error('시간이 너무 오래 걸립니다')); }, 25000);

    var q = [];
    for (var k in params) {
      if (params.hasOwnProperty(k)) q.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k]));
    }
    q.push('callback=' + name);
    s.src = API + (API.indexOf('?') < 0 ? '?' : '&') + q.join('&');
    document.body.appendChild(s);
  }

  /* ── 앞으로의 수업일 계산 (브라우저에서 바로 — 물어보지 않습니다) ── */
  var DAYNUM = { '일':0, '월':1, '화':2, '수':3, '목':4, '금':5, '토':6 };
  function upcoming(dayKo, holidays, howMany) {
    var target = DAYNUM[String(dayKo || '').charAt(0)];
    if (target === undefined) return [];
    holidays = holidays || [];
    var d = new Date();
    d.setHours(0, 0, 0, 0);
    d.setDate(d.getDate() + ((target - d.getDay() + 7) % 7));
    var out = [];
    for (var i = 0; i < 30 && out.length < (howMany || 8); i++) {
      var s = d.getFullYear() + '-' +
              ('0' + (d.getMonth() + 1)).slice(-2) + '-' +
              ('0' + d.getDate()).slice(-2);
      if (holidays.indexOf(s) < 0) out.push(s);
      d.setDate(d.getDate() + 7);
    }
    return out;
  }

  /* ── 반 목록 채우기 ──────────────────────────────────── */
  function paintClasses(keepValue) {
    var names = Object.keys(DATA);
    cls.innerHTML = '<option value="">— 반을 선택하세요 —</option>';
    names.forEach(function (n) {
      var o = document.createElement('option');
      o.value = n;
      o.textContent = n + '  (' + DATA[n].day + ' ' + DATA[n].time + ')';
      cls.appendChild(o);
    });
    cls.disabled = false;
    if (keepValue && DATA[keepValue]) cls.value = keepValue;
  }

  /* ① GitHub에 미리 넣어둔 목록 — 즉시 뜹니다 */
  function loadBaked(done) {
    var x = new XMLHttpRequest();
    x.open('GET', 'classes.json?t=' + Date.now(), true);
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      var ok = false;
      if (x.status >= 200 && x.status < 300) {
        try {
          var j = JSON.parse(x.responseText);
          if (j && j.classes && Object.keys(j.classes).length) { DATA = j.classes; ok = true; }
        } catch (e) {}
      }
      done(ok);
    };
    x.onerror = function () { done(false); };
    x.send();
  }

  /* ② 구글에서 최신본을 조용히 받아 맞춰둡니다 (화면은 이미 떠 있음) */
  function refreshFromServer(showErrors) {
    ask({ api: 'classes' }, function (res) {
      if (!res || !res.ok || !res.classes || !Object.keys(res.classes).length) {
        if (showErrors) loadFailed('목록을 받지 못했습니다.');
        return;
      }
      var before = JSON.stringify(DATA);
      if (before === JSON.stringify(res.classes)) return;   // 달라진 게 없으면 그대로
      var keep = cls.value;
      DATA = res.classes;
      paintClasses(keep);
      if (keep && DATA[keep]) fillFor(keep, date.value, stu.value);
      err.textContent = '';
      again.style.display = 'none';
    }, function (e) {
      if (showErrors) loadFailed(e.message);
    });
  }

  function loadClasses() {
    err.textContent = '';
    again.style.display = 'none';
    cls.disabled = true;
    cls.innerHTML = '<option value="">불러오는 중…</option>';

    loadBaked(function (ok) {
      if (ok) {
        paintClasses();          // 바로 쓸 수 있게
        refreshFromServer(false); // 뒤에서 최신으로 맞춤
      } else {
        refreshFromServer(true);  // 미리 넣어둔 게 없으면 구글에서 받아옴
      }
    });
  }

  function loadFailed(msg) {
    cls.innerHTML = '<option value="">불러오지 못했습니다</option>';
    err.textContent = msg + ' 잠시 후 다시 시도해 주세요.';
    again.style.display = 'block';
  }

  again.addEventListener('click', loadClasses);

  /* ── 선택에 따라 아래 칸 채우기 ──────────────────────── */
  function fill(sel, list, ph) {
    sel.innerHTML = '';
    var p = document.createElement('option');
    p.value = ''; p.textContent = ph;
    sel.appendChild(p);
    list.forEach(function (v) {
      var o = document.createElement('option');
      o.value = v.v; o.textContent = v.t;
      sel.appendChild(o);
    });
    sel.disabled = false;
  }

  function fillFor(className, keepDate, keepStu) {
    var c = DATA && DATA[className];
    if (!c) { date.disabled = stu.disabled = true; return check(); }

    var days = upcoming(c.day, c.holidays, 8);   // 날짜는 항상 브라우저에서 계산
    fill(date, days.map(function (d) {
      var p = d.split('-'), dt = new Date(+p[0], +p[1] - 1, +p[2]);
      return { v: d, t: (+p[1]) + '월 ' + (+p[2]) + '일 (' + DOW[dt.getDay()] + ')' };
    }), '— 날짜를 선택하세요 —');
    if (keepDate && days.indexOf(keepDate) >= 0) date.value = keepDate;

    // 이름만 오는 옛 형식과, 표시용 이름이 함께 오는 새 형식 둘 다 받습니다
    var ss = c.students.map(function (s) {
      return (typeof s === 'string') ? { v: s, t: s } : { v: s.n, t: s.label || s.n };
    });
    ss.push({ v: '__OTHER__', t: '명단에 없어요 (직접 입력)' });
    fill(stu, ss, '— 학생을 선택하세요 —');
    var names = ss.map(function (x) { return x.v; });
    if (keepStu && names.indexOf(keepStu) >= 0) stu.value = keepStu;

    check();
  }

  cls.addEventListener('change', function () {
    other.style.display = 'none'; other.value = ''; err.textContent = '';
    fillFor(cls.value);
  });

  stu.addEventListener('change', function () {
    other.style.display = (stu.value === '__OTHER__') ? 'block' : 'none';
    check();
  });
  [date, other].forEach(function (el) {
    el.addEventListener('input', check);
    el.addEventListener('change', check);
  });

  function name() { return stu.value === '__OTHER__' ? other.value.trim() : stu.value; }
  function check() { go.disabled = !(cls.value && date.value && name()); }

  /* ── 보내기 ──────────────────────────────────────────── */
  go.addEventListener('click', function () {
    go.disabled = true; go.textContent = '전달하는 중…'; err.textContent = '';
    ask({
      api: 'submit',
      cls: cls.value,
      date: date.value,
      student: name(),
      reason: $('reason').value
    }, function (r) {
      if (!r || !r.ok) {
        err.textContent = (r && r.msg) || '전달하지 못했습니다. 잠시 후 다시 시도해 주세요.';
        go.disabled = false; go.textContent = '결석 전달하기';
        return;
      }
      var p = r.date.split('-');
      $('summary').innerHTML =
        '<div><b>반</b>' + r.cls + '</div>' +
        '<div><b>학생</b>' + r.student + '</div>' +
        '<div><b>결석일</b>' + (+p[1]) + '월 ' + (+p[2]) + '일</div>' +
        '<div><b>담당</b>' + (r.teachers || '확인 중') + '</div>';
      if (!r.known) {
        $('extra').innerHTML = '<div class="warn">명단에 없는 이름이라 원장님이 한 번 더 확인합니다.</div>';
      }
      $('form').style.display = 'none';
      $('done').style.display = 'block';
      window.scrollTo(0, 0);
    }, function (e) {
      err.textContent = '전달하지 못했습니다: ' + e.message;
      go.disabled = false; go.textContent = '결석 전달하기';
    });
  });

  loadClasses();
})();
</script>
</body>
</html>
