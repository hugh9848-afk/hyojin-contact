<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#2f6fdb">
<title>효진외국어학원</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">

<script src="config.js"></script>
<script>
/* 서버 주소는 이제 config.js 에서 한 번만 관리합니다 */
var API = window.HYOJIN_API;
</script>

<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f6f7f9;color:#1a1a1a;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    line-height:1.5;-webkit-text-size-adjust:100%}
  .wrap{max-width:720px;margin:0 auto;padding:16px 14px 60px}

  .top{display:flex;align-items:center;gap:10px;margin-bottom:14px;min-height:34px}
  .top h1{font-size:17px;margin:0;font-weight:700;flex:1;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .who{font-size:13px;color:#667}
  .pend{font-size:12px;font-weight:700;color:#8a5809;background:#fbf1dc;
    border-radius:9px;padding:3px 9px;white-space:nowrap}
  .pend.done{color:#20624a;background:#e2f0ea}
  .back{background:#fff;border:1px solid #d5d8dd;border-radius:8px;padding:6px 11px;
    font-size:14px;cursor:pointer;font-family:inherit;color:#2f6fdb;font-weight:600}

  .card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);
    padding:14px;margin-bottom:12px}
  .msg{padding:26px 14px;text-align:center;color:#777;font-size:15px}
  .err{color:#c0392b}

  /* 반 목록 */
  .clsbtn{display:block;width:100%;text-align:left;background:#fff;border:0;
    border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08);padding:14px;margin-bottom:10px;
    cursor:pointer;font-family:inherit}
  .clsbtn .nm{font-size:16px;font-weight:700}
  .clsbtn .sub{font-size:13px;color:#667;margin-top:3px}

  /* 탭 */
  .tabs{display:flex;gap:6px;margin-bottom:12px}
  .tab{flex:1;padding:10px;border:1px solid #d5d8dd;background:#fff;border-radius:9px;
    font-size:15px;font-weight:600;color:#667;cursor:pointer;font-family:inherit}
  .tab.on{background:#2f6fdb;border-color:#2f6fdb;color:#fff}

  /* 명단 */
  .stu{padding:11px 2px;border-bottom:1px solid #eef0f3}
  .stu:last-child{border-bottom:0}
  .stuhead{display:flex;align-items:center;gap:8px}
  .stu .nm{flex:1;min-width:0}
  .stu .nm b{font-size:15.5px;font-weight:600}
  /* 이름 왼쪽 번호 — 몇 명인지 눈으로 바로 세어지라고 붙입니다 */
  .no{display:inline-block;min-width:17px;margin-right:6px;text-align:right;
    font-size:12px;color:#98a0ab;font-weight:600;font-variant-numeric:tabular-nums}
  .cnt{padding:2px 2px 9px;font-size:12.5px;color:#667;font-weight:600}
  .tip{margin:0 0 8px;padding:7px 10px;border-radius:8px;background:#eef3ff;
    color:#3b4a63;font-size:12.5px;line-height:1.4}
  .tip b{color:#1f3d78}
  .tels{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
  a.tel{display:inline-flex;align-items:baseline;gap:6px;background:#f4f7fb;
    border:1px solid #d9e2ef;border-radius:8px;padding:7px 11px;font-size:14.5px;
    color:#1155cc;text-decoration:none;font-variant-numeric:tabular-nums}
  a.tel span{font-size:11.5px;color:#8a90a0}
  .telnone{font-size:13px;color:#9aa0ac;padding:5px 2px}
  .badge{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:9px;
    font-size:11.5px;font-weight:700;vertical-align:middle}
  .b-pay{background:#e2f0ea;color:#20624a}
  .b-un{background:#fdeaea;color:#b02a2a}
  .b-etc{background:#eef0f3;color:#5a6270}
  .paynote{font-size:13px;color:#8a90a0;padding:2px 0 10px;border-bottom:1px solid #eef0f3}
  .mini{background:#fff;border:1px solid #d5d8dd;border-radius:8px;padding:7px 10px;
    font-size:13.5px;cursor:pointer;font-family:inherit;white-space:nowrap;color:#333;
    text-decoration:none;display:inline-block}
  .mini.warn{color:#b45309;border-color:#e6cfa4;background:#fffaf0}

  /* 출석부 */
  .mon{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:10px}
  .mon button{background:#fff;border:1px solid #d5d8dd;border-radius:8px;width:38px;height:34px;
    font-size:16px;cursor:pointer;font-family:inherit}
  .mon .lbl{font-size:16px;font-weight:700;min-width:110px;text-align:center}
  .gridwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;background:#fff;
    border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  table{border-collapse:separate;border-spacing:0;font-size:14px;min-width:100%}
  th,td{padding:0;margin:0}
  .hname,.cname{position:sticky;left:0;background:#fff;z-index:2;
    min-width:112px;max-width:112px;padding:8px 10px;text-align:left;
    border-right:1px solid #e3e6ea;border-bottom:1px solid #eef0f3;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hname{background:#f7f8fa;font-size:12px;color:#667;font-weight:600}
  .hdate{min-width:54px;padding:7px 4px;text-align:center;font-size:12px;line-height:1.25;
    background:#f7f8fa;color:#445;border-bottom:1px solid #e3e6ea;font-weight:600;
    border-left:1px solid #eef0f3;cursor:default}
  /* 실장님 화면에서는 날짜 칸이 '휴강 버튼'입니다 — 눌러도 되는 곳임을 점선으로 알립니다 */
  .hdate.adm{cursor:pointer;text-decoration:underline dotted #a8b0bd;text-underline-offset:3px}
  .hdate.adm:active{background:#e9edf5}
  .hdate .dw{display:block;font-size:10.5px;color:#8a90a0;font-weight:500}
  .hdate.hol{background:#e6e6e6;color:#777}
  .cell{min-width:54px;height:40px;text-align:center;font-size:13.5px;font-weight:600;
    border-left:1px solid #eef0f3;border-bottom:1px solid #eef0f3;cursor:pointer;
    -webkit-user-select:none;user-select:none}
  .cell.lock{cursor:default;color:#bbb}
  .cell.out{background:#efefef;cursor:default;color:#ccc}
  .cell.hol{background:#d9d9d9;cursor:default;color:#888}
  .cell.busy{opacity:.62}
  /* 답이 안 와서 아직 못 보낸 칸 — 표시는 살려두고 점선으로만 알립니다 */
  .cell.wait{box-shadow:inset 0 0 0 2px #e0a800}
  .legend{margin-top:10px;font-size:12.5px;color:#778;text-align:center}
  .legend i{font-style:normal;display:inline-block;width:13px;height:13px;border-radius:3px;
    vertical-align:-2px;margin:0 3px 0 10px;border:1px solid rgba(0,0,0,.08)}

  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
    background:#222;color:#fff;padding:11px 16px;border-radius:10px;font-size:14px;
    max-width:88%;text-align:center;opacity:0;pointer-events:none;transition:opacity .18s;z-index:50}
  .toast.on{opacity:.94}
  .toast.bad{background:#b02a2a}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <button class="back" id="back" style="display:none">← 뒤로</button>
    <h1 id="title">효진외국어학원</h1>
    <span class="pend" id="pend" style="display:none"></span>
    <span class="who" id="who"></span>
  </div>
  <div id="body"><div class="msg">불러오는 중…</div></div>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  /* 토큰은 ?v=... 로 와도 되고, #v=... (주소창·기록·로그에 덜 남음) 로 와도 됩니다 */
  var V = (function () {
    var m = location.search.match(/[?&]v=([^&]+)/) || location.hash.match(/[#?&]v=([^&]+)/);
    return m ? decodeURIComponent(m[1]) : '';
  })();

  var ROSTER = null;      // {who,isAdmin,classes:[{ab,day,time,room,students:[{n,p,s}]}]}
  var CUR    = null;      // 지금 보고 있는 반
  var MONTH  = null;      // loadMonth 결과
  var YM     = null;
  var TAB    = 'list';    // list | roster | att
  var DOW    = ['일','월','화','수','목','금','토'];
  var CYCLE  = ['', 'O', '영상', 'X'];

  /* 선생님이 고칠 수 있는 기간: 수업일 ~ 그 다음 월요일까지
     (서버의 canEditDate_ 와 똑같은 규칙입니다) */
  function mondayAfter(ds) {
    var p = ds.split('-'), dt = new Date(+p[0], +p[1] - 1, +p[2]);
    var add = (8 - dt.getDay()) % 7;
    if (add === 0) add = 7;                 // 그 날이 월요일이면 다음 주 월요일
    dt.setDate(dt.getDate() + add);
    return dt.getFullYear() + '-' + ('0' + (dt.getMonth() + 1)).slice(-2)
         + '-' + ('0' + dt.getDate()).slice(-2);
  }
  function canEdit(d) {
    if (!MONTH) return false;
    if (MONTH.isAdmin) return true;
    if (d > MONTH.today) return false;      // 아직 오지 않은 수업
    return MONTH.today <= mondayAfter(d);
  }
  var COLOR  = { 'O':'#d9ead3', '영상':'#cfe2f3', 'X':'#f4cccc', '':'#ffffff' };

  /* ── 서버와 이야기하기 (JSONP) ─────────────────────── */
  var seq = 0;

  /* 구글 서버가 자다 깨느라 첫 요청이 늦을 때가 있어 한 번 더 시도합니다.
     단 '결석확인'은 메일이 나가므로 다시 보내지 않습니다. */
  function ask(params, ok, fail) {
    // 결석확인은 메일을 보내느라 오래 걸립니다. 넉넉히 기다리고, 다시 보내지 않습니다.
    var wait = (params.api === 'absent') ? 120000 : 30000;
    askOnce(params, ok, function (e) {
      if (params.api === 'absent') return fail(e);
      askOnce(params, ok, fail, wait);
    }, wait);
  }

  function askOnce(params, ok, fail, waitMs) {
    var name = '__hj_' + (++seq);
    var s = document.createElement('script'), timer;
    function cleanup() {
      clearTimeout(timer);
      try { delete window[name]; } catch (e) { window[name] = undefined; }
      if (s.parentNode) s.parentNode.removeChild(s);
    }
    window[name] = function (res) { cleanup(); ok(res); };
    s.onerror = function () { cleanup(); fail(new Error('연결하지 못했습니다')); };
    timer = setTimeout(function () { cleanup(); fail(new Error('시간이 오래 걸립니다')); }, waitMs || 30000);
    var q = ['v=' + encodeURIComponent(V)];
    for (var k in params) {
      if (params.hasOwnProperty(k)) q.push(encodeURIComponent(k) + '=' + encodeURIComponent(params[k]));
    }
    q.push('callback=' + name);
    s.src = API + (API.indexOf('?') < 0 ? '?' : '&') + q.join('&');
    document.body.appendChild(s);
  }

  var tt;
  function toast(msg, bad) {
    var t = $('toast');
    t.textContent = msg;
    t.className = 'toast on' + (bad ? ' bad' : '');
    clearTimeout(tt);
    tt = setTimeout(function () { t.className = 'toast'; }, bad ? 3600 : 1900);
  }
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function ymNow() {
    var d = new Date();
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2);
  }
  function ymShift(ym, n) {
    var p = ym.split('-'), d = new Date(+p[0], +p[1] - 1 + n, 1);
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2);
  }

  /* ── 첫 화면: 반 목록 ───────────────────────────────── */
  /* 지난번에 본 반 목록을 이 기계 안에 적어 둡니다.
     (전화번호는 빼고 이름만 — 화면에 곧바로 뜨게 하려는 용도) */
  var RKEY = 'hyojin_roster_' + V;
  function saveRosterLean(r) {
    try {
      var lean = {
        ok: true, who: r.who, isAdmin: r.isAdmin,
        classes: (r.classes || []).map(function (c) {
          return {
            ab: c.ab, day: c.day, time: c.time, room: c.room,
            students: (c.students || []).map(function (s) { return { n: s.n }; })
          };
        })
      };
      localStorage.setItem(RKEY, JSON.stringify(lean));
    } catch (e) {}
  }

  /* 이 명단이 "이름만" 저장된 캐시인지 확인합니다.
     학생은 있는데 전화번호가 하나도 없으면 = 아직 최신 명단을 못 받은 상태입니다. */
  function isLeanRoster(r) {
    if (!r || !r.classes) return false;
    for (var i = 0; i < r.classes.length; i++) {
      var st = r.classes[i].students || [];
      for (var j = 0; j < st.length; j++) {
        if (st[j].p || st[j].s) return false;   // 번호가 하나라도 있으면 lean 아님
      }
    }
    return true;
  }
  function findClass(r, ab) {
    var cs = (r && r.classes) || [];
    for (var i = 0; i < cs.length; i++) if (cs[i].ab === ab) return cs[i];
    return null;
  }

  function start() {
    if (!V) { return fatal('주소가 올바르지 않습니다. 받으신 링크를 다시 확인해 주세요.'); }

    // ① 적어둔 게 있으면 기다리지 않고 먼저 보여줍니다
    try {
      var cached = JSON.parse(localStorage.getItem(RKEY) || 'null');
      if (cached && cached.classes) {
        ROSTER = cached;
        $('who').textContent = cached.who || '';
        showList();
      }
    } catch (e) {}

    // ② 그러는 동안 최신 명단(전화번호 포함)을 받아 맞춰 둡니다
    ask({ api: 'roster' }, function (r) {
      if (!r || !r.ok) { if (!ROSTER) fatal((r && r.msg) || '명단을 받지 못했습니다.'); return; }
      var 캐시로열어둠 = isLeanRoster(ROSTER);
      ROSTER = r;
      saveRosterLean(r);
      $('who').textContent = r.who || '';
      if (TAB === 'list') {
        showList();
      } else if (CUR) {
        /* 캐시(이름만)로 반 화면을 열어둔 사이에 전화번호가 든 최신 명단이 도착했습니다.
           지금 보던 반을 최신 것으로 바꿔 끼우고, 명단 탭이면 다시 그립니다. */
        var 최신반 = findClass(r, CUR.ab);
        if (최신반) {
          CUR = 최신반;
          if (TAB === 'roster' && 캐시로열어둠) render();
        }
      }
      pendReplay();          // 지난번에 못 보낸 출석이 있으면 지금 보냅니다
    }, function (e) {
      if (!ROSTER) return fatal(e.message);
      /* 캐시(이름만)만 있는 채로 최신 명단을 못 받으면 전화번호가 안 뜹니다.
         조용히 한 번 더 시도합니다. */
      if (isLeanRoster(ROSTER)) setTimeout(function () {
        ask({ api: 'roster' }, function (r2) {
          if (!r2 || !r2.ok) return;
          ROSTER = r2; saveRosterLean(r2);
          if (TAB === 'list') showList();
          else if (CUR) {
            var f = findClass(r2, CUR.ab);
            if (f) { CUR = f; if (TAB === 'roster') render(); }
          }
        }, function () {});
      }, 4000);
    });
  }

  function fatal(msg) {
    $('body').innerHTML = '<div class="card"><div class="msg err">' + esc(msg) + '</div>'
      + '<div style="text-align:center;padding-bottom:8px">'
      + '<button class="back" id="again">다시 시도</button></div></div>';
    var a = $('again');
    if (a) a.addEventListener('click', function () {
      $('body').innerHTML = '<div class="msg">불러오는 중…</div>';
      start();
    });
  }

  function showList() {
    TAB = 'list'; CUR = null; MONTH = null;
    $('back').style.display = 'none';
    $('title').textContent = '효진외국어학원';
    if (!ROSTER.classes.length) {
      return $('body').innerHTML = '<div class="card"><div class="msg">맡으신 반이 없습니다.</div></div>';
    }
    var h = '';
    ROSTER.classes.forEach(function (c, i) {
      h += '<button class="clsbtn" data-i="' + i + '">'
        +  '<div class="nm">' + esc(c.ab) + '</div>'
        +  '<div class="sub">' + esc(c.day) + ' ' + esc(c.time)
        +  (c.room ? ' · ' + esc(c.room) : '')
        +  ' · 재원 ' + c.students.length + '명</div></button>';
    });
    $('body').innerHTML = h;
    [].forEach.call(document.querySelectorAll('.clsbtn'), function (b) {
      b.addEventListener('click', function () { openClass(+b.getAttribute('data-i')); });
    });
  }

  /* ── 반 화면 ────────────────────────────────────────── */
  function openClass(i) {
    CUR = ROSTER.classes[i];
    YM = ymNow();
    TAB = 'roster';
    $('back').style.display = 'block';
    $('title').textContent = CUR.ab;
    $('body').innerHTML = '<div class="card"><div class="msg">불러오는 중…</div></div>';
    fetchMonth();
  }

  /* 한 번 받아온 달은 기억해 둡니다. 앞뒤 달은 미리 받아둬서
     ◀ ▶ 를 눌렀을 때 기다리지 않게 합니다. */
  var MCACHE = {};
  var FRESH  = 180000;   // 3분
  function mkey(ab, ym) { return ab + '|' + ym; }

  /* 서버가 아직 모르는 내 최근 터치를 화면에 덮어씌웁니다.
     (저장이 아직 전달되지 않았어도 선생님이 누른 대로 보이게) */
  function applyPending(data, ab) {
    var o = pendAll();
    Object.keys(o).forEach(function (k) {
      var p = o[k];
      if (p.ab !== ab) return;
      (data.students || []).forEach(function (s) {
        if (s.n !== p.n) return;
        s.marks.forEach(function (m) { if (m.d === p.d) m.m = p.v; });
      });
    });
    return data;
  }

  function fetchMonth() {
    var k = mkey(CUR.ab, YM), c = MCACHE[k];
    if (c && (new Date().getTime() - c.t) < FRESH) {
      MONTH = applyPending(c.data, CUR.ab);
      render();
      prefetch();
      return;
    }
    ask({ api: 'month', ab: CUR.ab, ym: YM }, function (r) {
      if (!r || !r.ok) {
        MONTH = null;
        $('body').innerHTML = tabsHtml()
          + '<div class="card"><div class="msg err">' + esc((r && r.msg) || '불러오지 못했습니다.') + '</div></div>';
        bindTabs();
        return;
      }
      MCACHE[k] = { t: new Date().getTime(), data: r };
      MONTH = applyPending(r, CUR.ab);
      render();
      prefetch();
    }, function (e) {
      $('body').innerHTML = tabsHtml()
        + '<div class="card"><div class="msg err">' + esc(e.message) + '</div></div>';
      bindTabs();
    });
  }

  /* 화면을 보여준 뒤, 조용히 앞뒤 달을 받아둡니다 */
  function prefetch() {
    [ymShift(YM, -1), ymShift(YM, 1)].forEach(function (ym) {
      var k = mkey(CUR.ab, ym), c = MCACHE[k];
      if (c && (new Date().getTime() - c.t) < FRESH) return;
      ask({ api: 'month', ab: CUR.ab, ym: ym }, function (r) {
        if (!r || !r.ok) return;
        MCACHE[k] = { t: new Date().getTime(), data: applyPending(r, CUR.ab) };
        // 명단을 보고 있는데 이번 달엔 납부 정보가 없었다면, 이제 채워서 다시 그립니다
        if (TAB === 'roster' && MONTH && !MONTH.hasPay && r.hasPay) render();
      }, function () {});
    });
  }

  function tabsHtml() {

  /* ── 반별명단 ───────────────────────────────────────── */
  /* 납부 정보는 학원이 "다음 달분"을 미리 청구하는 달이 있어서,
     이번 달에 없으면 미리 받아둔 다음 달 것을 씁니다. */
  function paySource() {
    if (MONTH && MONTH.hasPay) return { data: MONTH, ym: YM };
    var nx = MCACHE[mkey(CUR.ab, ymShift(YM, 1))];
    if (nx && nx.data && nx.data.hasPay) return { data: nx.data, ym: ymShift(YM, 1) };
    return null;
  }

  function badgeClass(st) {
    if (/미납|연체/.test(st)) return 'b-un';
    if (/납부|완납|수납|입금|^등록$/.test(st)) return 'b-pay';
    return 'b-etc';                       // 청구전 · 등록대기 등
  }

  function rosterHtml() {
    var src = paySource(), payOf = {}, payMonth = '';
    if (src) {
      payMonth = (+src.ym.split('-')[1]) + '월 ';

    var h = '<div class="card">';
    if (!src) {
      h += '<div class="paynote">아직 이 달 수강료 청구 정보가 없습니다.</div>';
    }
    h += '<div class="cnt">총 ' + CUR.students.length + '명</div>';   // 몇 명인지 한눈에
    CUR.students.forEach(function (s, i) {
      var pay = payOf[s.n], badge = '';
      if (pay) {
        // pay.alt = 성남사랑·카드·현금 등 대체결제 (파기·취소였지만 메모로 납부 확인된 경우)
        var txt = payMonth + esc(pay.st) + (pay.alt ? ' · ' + esc(pay.alt) : '');
        badge = '<span class="badge ' + badgeClass(String(pay.st)) + '">' + txt + '</span>';
      }

      if (s.p) tels += '<a class="tel" href="tel:' + esc(s.p) + '"><span>학부모</span>' + esc(s.p) + '</a>';
      if (s.s) tels += '<a class="tel" href="tel:' + esc(s.s) + '"><span>학생</span>' + esc(s.s) + '</a>';
      if (!s.p && !s.s) tels = '<span class="telnone">전화번호 없음</span>';

      h += '<div class="stu">'
        +  '<div class="stuhead">'
        +    '<div class="nm"><span class="no">' + (i + 1) + '</span><b>' + esc(s.n) + '</b>' + badge + '</div>'
        +    '<button class="mini warn" data-ab="' + i + '">결석확인</button>'
        +  '</div>'
        +  '<div class="tels">' + tels + '</div>'
        +  '</div>';

  function bindRoster() {
    [].forEach.call(document.querySelectorAll('.mini.warn'), function (b) {
      b.addEventListener('click', function () {
        var s = CUR.students[+b.getAttribute('data-ab')];

          }
          b.disabled = false; b.textContent = '결석확인';
          toast((r && r.msg) || '보내지 못했습니다.', true);
        }, function () {
          // 응답이 늦어도 대개는 이미 보내진 상태입니다.
          // 여기서 다시 누르게 하면 메일이 두 번 갑니다.
          b.textContent = '확인 중';
          toast('전송 확인이 늦어지고 있습니다. 메일함을 먼저 확인해 주세요. 안 왔을 때만 다시 시도하세요.', true);
          setTimeout(function () { b.disabled = false; b.textContent = '결석확인'; }, 60000);
        });
      });

  }

  /* ── 출석부 ─────────────────────────────────────────── */
  function attHtml() {
    if (!MONTH) return '<div class="card"><div class="msg">불러오는 중…</div></div>';
    var p = YM.split('-');
    var h = '<div class="mon"><button id="pm">◀</button>'
      + '<span class="lbl">' + (+p[0]) + '년 ' + (+p[1]) + '월</span>'
      + '<button id="nm">▶</button></div>';

    if (!MONTH.dates.length) {
      return h + '<div class="card"><div class="msg">이 달에는 수업일이 없습니다.</div></div>';

    // 실장님에게는 휴강 바꾸는 법을 한 줄로 알려 줍니다 (날짜 칸이 버튼이라는 걸 모르기 쉬워요)
    if (MONTH.isAdmin) {

        if (!m.out && !hol && m.m) style = ' style="background:' + (COLOR[m.m] || '#fff') + '"';
        h += '<td class="' + cl + '"' + style
          +  ' data-d="' + m.d + '" data-n="' + esc(s.n) + '"'
          +  ' data-saved="' + esc(m.m) + '">' + esc(m.m) + '</td>';

      +  '<div class="legend"><i style="background:#d9ead3"></i>출석'
      +  '<i style="background:#cfe2f3"></i>영상<i style="background:#f4cccc"></i>결석'

  function bindAtt() {
    var pm = $('pm'), nm = $('nm');
    if (pm) pm.addEventListener('click', function () { YM = ymShift(YM, -1); loadingGrid(); fetchMonth(); });
    if (nm) nm.addEventListener('click', function () { YM = ymShift(YM, +1); loadingGrid(); fetchMonth(); });

    [].forEach.call(document.querySelectorAll('.cell'), function (td) {

      [].forEach.call(document.querySelectorAll('.hdate.adm'), function (th) {
        th.addEventListener('click', function () {
          var d = th.getAttribute('data-d');
          var on = !MONTH.holidays[d];
          if (!confirm(d + ' 을(를) ' + (on ? '휴강으로 바꿀까요?' : '휴강 해제할까요?'))) return;
          th.style.opacity = '.5';
          ask({ api: 'holiday', ab: CUR.ab, date: d, on: on ? 1 : 0 }, function (r) {
            th.style.opacity = '';
            if (!r || !r.ok) return toast((r && r.msg) || '바꾸지 못했습니다.', true);
            // 다시 받아오지 않고 화면만 고칩니다 (한 번 더 기다릴 일이 없게)
            MONTH.holidays = MONTH.holidays || {};
            if (on) MONTH.holidays[d] = true; else delete MONTH.holidays[d];
            toast(on ? '휴강으로 바꿨습니다.' : '휴강을 풀었습니다.');
            render();

  }

  function loadingGrid() {
    $('body').innerHTML = tabsHtml() + '<div class="card"><div class="msg">불러오는 중…</div></div>';
    bindTabs();
  }

  /* ── 저장 대기함 ────────────────────────────────────────
     칸을 누르는 즉시 이 기계 안에 적어둡니다.
     서버가 "저장했다"고 답해야만 지웁니다.
     그래서 도중에 창을 닫거나 전파가 끊겨도 기록이 사라지지 않고,
     다음에 열 때 자동으로 다시 보냅니다.                      */
  var PKEY = 'hyojin_pending_marks_v1';
  var MAXAGE = 3 * 24 * 3600 * 1000;   // 3일 지난 건 버립니다

  /* 수첩을 못 읽었을 때 **빈 수첩인 척하면 안 됩니다.**
     빈 것으로 여기고 저장해 버리면 밀려 있던 출석이 통째로 날아갑니다.
     그래서 못 읽으면 '못읽음' 표를 세워두고, 그 뒤로는 **덮어쓰기를 거부**합니다. */
  var 수첩못읽음 = false;
  function pendAll() {
    try {
      var raw = localStorage.getItem(PKEY);
      if (raw === null) { 수첩못읽음 = false; return {}; }   // 아직 아무것도 없음 — 정상
      var o = JSON.parse(raw);
      // JSON 으로는 멀쩡해도 모양이 틀린 것(null·숫자·글자·목록)은 '못 읽음' 으로 봅니다
      if (!o || typeof o !== 'object'
          || Object.prototype.toString.call(o) === '[object Array]') {
        수첩못읽음 = true; return {};
      }
      수첩못읽음 = false;                       // 제대로 읽었으니 표를 내립니다
      return o;
    } catch (e) {
      수첩못읽음 = true;
      return {};
    }
  }
  /** 저장에 성공하면 true, 못 했으면 false 를 돌려줍니다. */
  function pendPut(o) {
    if (수첩못읽음) return false;               // 못 읽은 상태에서는 절대 덮어쓰지 않습니다
    try { localStorage.setItem(PKEY, JSON.stringify(o)); }
    catch (e) { return false; }                // 저장 공간이 꽉 찼을 때도 여기로 옵니다
    paintPend();
    return true;
  }
  /* 누를 때마다 1씩 오르는 번호표입니다.
     'O 눌렀다 X 눌렀다 다시 O' 처럼 **값이 같아도 다른 누름**인 경우가 있어서,
     값만 견주면 첫 번째 O 의 늦은 답이 세 번째 O 를 지워버립니다. 번호표면 안 헷갈립니다. */
  /* 페이지를 열 때마다 달라지는 도장입니다.
     번호표를 1,2,3… 으로만 하면 **새로고침하면 다시 1부터** 시작합니다.
     그러면 지난번에 남은 1번과 이번에 새로 누른 1번이 같아 보여서,
     지난번 것의 늦은 답이 방금 누른 것을 지워버립니다. 도장을 앞에 붙여 막습니다. */
  var 페이지도장 = new Date().getTime().toString(36) + Math.random().toString(36).slice(2, 8);
  var 누름번호 = 0;
  function 새번호표() { 누름번호++; return 페이지도장 + '-' + 누름번호; }

  /** 적는 데 성공하면 번호표를, 실패하면 null 을 돌려줍니다. */
  function pendAdd(ab, d, n, v) {
    var o = pendAll();
    if (수첩못읽음) return null;                    // 못 적었습니다 — 거짓말하지 않습니다
    var rev = 새번호표();
    o[ab + '|' + d + '|' + n] = { ab: ab, d: d, n: n, v: v, r: rev, t: new Date().getTime() };
    return pendPut(o) ? rev : null;
  }
  function pendDone(ab, d, n) {
    var o = pendAll();
    delete o[ab + '|' + d + '|' + n];
    pendPut(o);
  }

  /* 수첩에서 지울 때 **보낸 값과 적힌 값이 같은지** 먼저 봅니다.
     열쇠가 '반|날짜|이름' 뿐이라, 늦게 도착한 옛 응답이
     방금 누른 새 값을 지워버리는 일이 있었습니다.
     (O 를 눌렀다가 곧바로 X 로 고쳤는데, O 의 응답이 뒤늦게 와서 X 가 사라지는 식) */
  function pendDoneIf(ab, d, n, v, rev) {
    var o = pendAll(), k = ab + '|' + d + '|' + n, cur = o[k];
    if (!cur) return;
    // 번호표가 있으면 번호표로, 없으면(옛 기록) 값으로 견줍니다
    if (rev != null && cur.r != null) { if (cur.r !== rev) return; }
    else if (cur.v !== v) return;
    delete o[k];
    pendPut(o);
    화면에서_기다림표시_지우기(ab, d, n, cur.v);
  }

  /** 밀린 것이 뒤늦게 저장됐을 때, 화면에 남은 노란 테두리도 같이 지웁니다.
      (이게 없으면 저장이 됐는데도 테두리가 영영 남아 선생님이 불안해합니다)

      주의 두 가지 —
      ① **지금 보고 있는 반이 그 반일 때만** 손댑니다. 같은 날짜·같은 이름이
         다른 반에도 있으면 엉뚱한 반의 칸을 고칠 뻔했습니다.
      ② 학생 이름을 찾는 글귀에 **끼워 넣지 않습니다.** 이름에 이상한 글자가 있으면
         찾기가 깨지는데, 그 깨짐이 재전송 줄을 통째로 멈추게 했습니다. */
  function 화면에서_기다림표시_지우기(ab, d, n, v) {
    try {
      if (!CUR || CUR.ab !== ab) return;          // 지금 그 반 화면이 아니면 할 일 없음
      var tds = document.querySelectorAll('td.cell[data-d="' + d + '"]');
      for (var i = 0; i < tds.length; i++) {
        if (tds[i].getAttribute('data-n') !== n) continue;   // 이름은 여기서 견줍니다
        tds[i].classList.remove('wait');
        if (v != null) tds[i].setAttribute('data-saved', v);
      }
    } catch (e) { /* 화면 정리가 실패해도 저장에는 지장이 없어야 합니다 */ }
  }

  var doneTimer;
  function paintPend() {
    var el = $('pend'); if (!el) return;
    var cnt = Object.keys(pendAll()).length;
    clearTimeout(doneTimer);
    if (cnt) {
      el.textContent = '저장 중 ' + cnt;
      el.className = 'pend';
      el.style.display = '';
    } else if (el.style.display !== 'none') {
      el.textContent = '저장됨';
      el.className = 'pend done';
      doneTimer = setTimeout(function () { el.style.display = 'none'; }, 1600);
    }
  }

  /** 못 보낸 것이 있으면 다시 보냅니다 (페이지를 열 때)
      예전에는 밀린 것을 **한꺼번에** 쏘았습니다. 20개가 밀려 있으면 20발이 동시에 나가
      구글 서버가 오히려 느려졌습니다. 이제 **하나 끝나면 다음 하나**로 갑니다. */
  var 다시보내는중 = false;
  function pendReplay() {
    if (다시보내는중) return;          // 이미 돌고 있으면 또 시작하지 않습니다

    // 3일 지난 것은 먼저 버립니다
    var o = pendAll(), now = new Date().getTime(), changed = false;
    Object.keys(o).forEach(function (k) {
      if (now - (o[k].t || 0) > MAXAGE) { delete o[k]; changed = true; }
    });
    if (changed) pendPut(o);

    // 번호표가 없는 옛 기록(지난 판에서 남은 것)에 번호표를 달아 둡니다.
    // 안 그러면 값으로만 견주게 되어 'O→X→O' 문제가 그대로 남습니다.
    var o2 = pendAll(), 번호달았나 = false;
    Object.keys(o2).forEach(function (k) {
      if (o2[k] && o2[k].r == null) { o2[k].r = 새번호표(); 번호달았나 = true; }
    });
    if (번호달았나) pendPut(o2);

    var 열쇠들 = Object.keys(pendAll());
    if (!열쇠들.length) { paintPend(); return; }
    다시보내는중 = true;

    (function 다음(i) {
      if (i >= 열쇠들.length) { 다시보내는중 = false; paintPend(); return; }
      var p = pendAll()[열쇠들[i]];
      if (!p) return 다음(i + 1);                 // 그 사이 지워졌으면 건너뜁니다
      function 이어서() { setTimeout(function () { 다음(i + 1); }, 150); }
      ask({ api: 'mark', ab: p.ab, date: p.d, student: p.n, mark: p.v }, function (r) {
        // try 로 감싸는 까닭 — 여기서 잘못되면 이어서() 에 못 가고
        // 다시보내는중 이 true 로 굳어 **그 뒤 재전송이 영영 안 돕니다.**
        try { if (r && r.ok) pendDoneIf(p.ab, p.d, p.n, p.v, p.r); } catch (e) {}
        이어서();
      }, function () {
        이어서();                                  // 하나 실패해도 나머지는 계속합니다
      });
    })(0);
  }

  /** 창을 닫는 순간, 남은 것을 끊기지 않는 방식으로 한 번 더 밀어냅니다.

      이 방식(no-cors)은 **답을 읽을 수 없습니다.** 그래서 보냈는지 알 수 없고,
      수첩에서 지우지도 못합니다. 그게 정상입니다 — 확인은 다음에 열 때 pendReplay 가 합니다.
      문제는 딴 앱으로 갔다 올 때마다 이게 다시 돌아서, 앱을 다섯 번 오가면
      같은 것을 다섯 번 쏘았다는 점입니다. 이제 **1분에 한 번만** 나갑니다. */
  var 마지막밀어냄 = 0;
  function pendFlush() {
    var o = pendAll();
    if (!Object.keys(o).length) return;
    var 지금 = new Date().getTime();
    if (지금 - 마지막밀어냄 < 60000) return;
    마지막밀어냄 = 지금;
    Object.keys(o).forEach(function (k) {
      var p = o[k];
      var url = API + (API.indexOf('?') < 0 ? '?' : '&')
        + 'v=' + encodeURIComponent(V) + '&api=mark'
        + '&ab=' + encodeURIComponent(p.ab) + '&date=' + encodeURIComponent(p.d)
        + '&student=' + encodeURIComponent(p.n) + '&mark=' + encodeURIComponent(p.v)
        + '&callback=x';
      try { fetch(url, { mode: 'no-cors', keepalive: true }); } catch (e) {}
    });
  }
  window.addEventListener('pagehide', pendFlush);
  document.addEventListener('visibilitychange', function () {
    if (document.visibilityState === 'hidden') pendFlush();
    // 돌아왔을 때는 답을 읽을 수 있는 쪽으로 다시 보냅니다 (이쪽이라야 수첩이 비워집니다)
    else pendReplay();
  });

  /* 터치는 즉시 반영하고 저장은 뒤에서 합니다.
     저장이 끝나기 전에 또 눌러도 막지 않습니다 — 마지막 값만 보냅니다. */
  var saveTurn = {};

  function cycle(td) {
    var cur  = td.textContent.trim();
    var next = CYCLE[(CYCLE.indexOf(cur) + 1) % CYCLE.length];

    td.textContent = next;
    td.style.background = COLOR[next] || '#fff';
    td.classList.remove('wait');      // 다시 눌렀으니 '아직 안 감' 표시는 지웁니다
    td.classList.add('busy');

    var d = td.getAttribute('data-d'), n = td.getAttribute('data-n');
    // **누른 순간의 반**을 여기서 붙잡습니다. 0.2초 뒤에 보내는데, 그 사이에
    // 뒤로 가거나 다른 반으로 옮길 수 있어서 그때 CUR 을 다시 보면 엉뚱해집니다.
    var 반 = CUR.ab;
    var key = 반 + '|' + d + '|' + n;              // 회차 열쇠에도 반을 넣습니다
    saveTurn[key] = (saveTurn[key] || 0) + 1;
    var turn = saveTurn[key];

    var rev = pendAdd(반, d, n, next);             // ★ 먼저 적어둡니다 (번호표를 받아 둡니다)
    if (rev === null) {
      // 이 기기에 못 적었습니다. "다음에 열면 다시 보냅니다" 는 이 경우 거짓말입니다.
      toast('이 기기에 임시 저장을 못 했습니다 — 지금 저장이 안 되면 다시 눌러 주세요.', true);
    }

    clearTimeout(td._timer);
    td._timer = setTimeout(function () { sendMark(td, 반, key, turn, rev); }, 200);
  }

  function sendMark(td, 반, key, turn, rev) {
    var d = td.getAttribute('data-d'), n = td.getAttribute('data-n');
    var val = td.textContent.trim();

    ask({ api: 'mark', ab: 반, date: d, student: n, mark: val }, function (r) {
      if (turn !== saveTurn[key]) return;          // 그 사이 또 눌렀으면 이 응답은 버립니다
      td.classList.remove('busy');
      // 서버가 "안 된다" 고 **말한 것**만 되돌립니다.
      // r 은 왔는데 ok 칸이 아예 없는 답은 "거절" 이 아니라 "모르겠음" 이라 그냥 둡니다.
      if (!r || typeof r.ok === 'undefined') return 보류(td, '서버 응답이 이상합니다.', rev !== null);
      if (!r.ok) return undo(td, 반, r.msg || '저장하지 못했습니다.');
      pendDoneIf(반, d, n, val, rev);               // ★ 그 누름이 그대로일 때만 지웁니다
      td.classList.remove('wait');
      td.setAttribute('data-saved', val);
      // 그 사이 다른 반으로 갔으면 **그 반의 자료를 건드리면 안 됩니다.**
      // (같은 날짜·같은 이름이 다른 반에도 있을 수 있습니다)
      if (CUR && CUR.ab === 반 && MONTH) {
        (MONTH.students || []).forEach(function (s) {
          if (s.n !== n) return;
          (s.marks || []).forEach(function (m) { if (m.d === d) m.m = val; });
        });
      }
    }, function (e) {
      if (turn !== saveTurn[key]) return;
      // ⚠️ 여기가 제일 중요합니다.
      // 예전에는 여기서도 undo() 를 불렀습니다. 그런데 이 자리는
      // "서버가 거절했다" 가 아니라 **"답이 아직 안 왔다"** 일 뿐입니다.
      // 되돌려 버리면 선생님이 눌러 둔 출석이 화면에서도 수첩에서도 사라졌습니다.
      // 이제는 표시를 그대로 두고, 다음에 열 때 다시 보냅니다.
      보류(td, '아직 저장 중입니다 (' + e.message + ')', rev !== null);
    });
  }

  /** 답이 안 왔을 뿐입니다 — 화면 표시도, 수첩도 **그대로 둡니다.**
      테두리만 노랗게 해서 "아직 안 갔다" 는 것만 알립니다. */
  function 보류(td, msg, 적어뒀나) {
    td.classList.remove('busy');
    td.classList.add('wait');
    // 이 기기에 적어두지도 못했으면 "다음에 다시 보냅니다" 는 **거짓말**입니다.
    // 보낼 것이 남아 있지 않으니 다시 보낼 수도 없습니다. 그때는 다시 누르시라고 합니다.
    toast(msg + (적어뒀나 === false
      ? ' — 이 기기에 적어두지도 못했습니다. 다시 눌러 주세요.'
      : ' — 표시는 그대로 두었습니다. 다음에 열면 다시 보냅니다.'), true);
    paintPend();
  }

  /** 서버가 **거절했을 때만** 되돌립니다 */
  function undo(td, 반, msg) {
    td.classList.remove('wait');
    // 지금 보고 있는 반이 아니라 **보낼 때의 반**에서 지웁니다
    pendDone(반 || (CUR && CUR.ab), td.getAttribute('data-d'), td.getAttribute('data-n'));
    var back = td.getAttribute('data-saved') || '';
    td.textContent = back;
    td.style.background = COLOR[back] || '#fff';
    toast(msg, true);
  }

  $('back').addEventListener('click', function () {
    if (TAB === 'list') return;
    showList();
  });

  start();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>
