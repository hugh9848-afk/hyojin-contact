<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EAEDF0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101216" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="하루 운영표">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2316181D'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%23D9A055' stroke-width='2'/%3E%3Cpath d='M16 10.5V16l3.6 2.6' stroke='%23D9A055' stroke-width='2' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="routine-icon.png">
<title>하루 운영표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&display=swap">
<style>
:root{
  --bg:#EAEDF0; --surface:#FFFFFF; --surface-2:#F3F5F8;
  --text:#181B21; --muted:#5F6875; --faint:#8B94A1;
  --line:#D3D9E0;
  --line-soft:#E4E8ED;
  --brass:#A96C12; --brass-soft:#F0E2CC;
  --teal:#2F6E6B; --teal-soft:#DCE9E8;
  --done:#3F7A4A;
  --shadow:0 1px 2px rgba(24,27,33,.06), 0 6px 16px -10px rgba(24,27,33,.18);
  --sans:"IBM Plex Sans KR", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101216; --surface:#191C22; --surface-2:#20242B;
    --text:#E6E9ED; --muted:#8D96A3; --faint:#6C7583;
    --line:#282D36; --line-soft:#232830;
    --brass:#D9A055; --brass-soft:#3A2E1C;
    --teal:#5DA6A1; --teal-soft:#1D2C2B;
    --done:#6FAE7C;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --bg:#101216; --surface:#191C22; --surface-2:#20242B;
  --text:#E6E9ED; --muted:#8D96A3; --faint:#6C7583;
  --line:#282D36; --line-soft:#232830;
  --brass:#D9A055; --brass-soft:#3A2E1C;
  --teal:#5DA6A1; --teal-soft:#1D2C2B;
  --done:#6FAE7C;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 6px 18px -12px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--text);
  font-family:var(--sans); font-weight:400;
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
.wrap{max-width:600px; margin:0 auto; padding:22px 16px 64px; display:flex; flex-direction:column; gap:18px}

/* ---------- header ---------- */
.head{display:flex; flex-direction:column; gap:14px}
.datebar{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.nav{
  font-family:var(--mono); font-size:16px; line-height:1; color:var(--muted); cursor:pointer;
  background:transparent; border:1px solid var(--line); border-radius:7px; padding:3px 9px 5px;
}
.nav:hover{color:var(--text); border-color:var(--faint)}
.nav:focus-visible{outline:2px solid var(--brass); outline-offset:2px}
.rel{font-family:var(--mono); font-size:11px; letter-spacing:.06em; color:var(--brass)}
.day{font-family:inherit; cursor:pointer}
.day:hover{border-color:var(--faint)}
.day:focus-visible{outline:2px solid var(--brass); outline-offset:2px}

.date{font-family:var(--mono); font-size:13px; letter-spacing:.04em; color:var(--muted); font-variant-numeric:tabular-nums}
h1{
  margin:0; font-size:27px; font-weight:600; letter-spacing:-.02em;
  text-wrap:balance;
}
.dow{color:var(--brass)}
.modes{display:flex; gap:6px; flex-wrap:wrap}
.chip{
  font-family:var(--mono); font-size:11.5px; letter-spacing:.05em;
  padding:5px 11px; border-radius:999px; cursor:pointer;
  background:transparent; color:var(--muted);
  border:1px solid var(--line); transition:.15s;
}
.chip:hover{color:var(--text); border-color:var(--faint)}
.chip[aria-pressed="true"]{background:var(--text); color:var(--bg); border-color:var(--text)}
.chip.auto[aria-pressed="true"]{background:var(--brass); border-color:var(--brass); color:#fff}
:root[data-theme="dark"] .chip.auto[aria-pressed="true"]{color:#171308}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.auto[aria-pressed="true"]{color:#171308}}

/* ---------- spine ---------- */
.spine{
  background:var(--surface); border:1px solid var(--line); border-radius:12px;
  padding:14px 16px; display:flex; flex-direction:column; gap:11px; box-shadow:var(--shadow);
}
.spine-hd{display:flex; justify-content:space-between; align-items:baseline; gap:10px}
.eyebrow{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--faint);
}
.spine-count{font-family:var(--mono); font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
.anchors{display:flex; flex-direction:column; gap:7px}
.anchor{display:flex; align-items:center; gap:9px; font-size:13.5px; color:var(--muted)}
.anchor .pip{
  width:9px; height:9px; border-radius:50%; flex:none;
  border:1.5px solid var(--brass); background:transparent;
}
.anchor.on .pip{background:var(--brass)}
.anchor.on{color:var(--text)}
.anchor .at{font-family:var(--mono); font-size:12px; color:var(--faint); margin-left:auto; font-variant-numeric:tabular-nums}

.bar{height:4px; border-radius:99px; background:var(--line-soft); overflow:hidden}
.bar > i{display:block; height:100%; width:0; background:var(--brass); border-radius:99px; transition:width .35s ease}

/* ---------- timeline ---------- */
.tl{display:flex; flex-direction:column; gap:6px; position:relative}
.row{display:grid; grid-template-columns:52px 1fr; gap:10px; align-items:stretch}
.rail{
  font-family:var(--mono); font-size:11.5px; color:var(--faint);
  font-variant-numeric:tabular-nums; padding-top:11px; text-align:right;
  display:flex; flex-direction:column; align-items:flex-end; gap:2px;
}
.rail .end{font-size:10.5px; opacity:.6}

.blk{
  position:relative; width:100%; text-align:left; cursor:pointer;
  background:var(--surface); border:1px solid var(--line); border-radius:11px;
  padding:11px 13px 11px 15px; display:flex; gap:11px; align-items:flex-start;
  min-height:max(58px, calc(var(--dur) * .7px));
  font-family:inherit; color:inherit; transition:border-color .15s, background .15s;
  box-shadow:var(--shadow);
}
.blk:hover{border-color:var(--faint)}
.blk:focus-visible{outline:2px solid var(--brass); outline-offset:2px}
.blk::before{
  content:""; position:absolute; left:0; top:11px; bottom:11px; width:3px; border-radius:0 3px 3px 0;
  background:var(--line);
}
.blk[data-kind="anchor"]::before{background:var(--brass)}
.blk[data-kind="core"]::before{background:var(--teal)}
.blk[data-kind="flex"]::before{background:repeating-linear-gradient(var(--faint) 0 3px, transparent 3px 7px)}

.box{
  width:19px; height:19px; flex:none; margin-top:1px; border-radius:6px;
  border:1.5px solid var(--line); display:grid; place-items:center; transition:.15s;
}
.box svg{width:11px; height:11px; opacity:0; stroke:var(--bg); stroke-width:2.6; fill:none; stroke-linecap:round; stroke-linejoin:round}
.blk.done .box{background:var(--done); border-color:var(--done)}
.blk.done .box svg{opacity:1}
.blk.done{background:var(--surface-2)}
.blk.done .t{color:var(--muted)}

.body{display:flex; flex-direction:column; gap:3px; min-width:0; flex:1}
.t{font-size:15px; font-weight:500; letter-spacing:-.01em}
.s{font-size:12.5px; color:var(--muted); font-weight:300; line-height:1.45}
.dur{
  font-family:var(--mono); font-size:10.5px; color:var(--faint);
  letter-spacing:.03em; font-variant-numeric:tabular-nums; margin-top:1px;
}
.tag{
  display:inline-block; font-family:var(--mono); font-size:10px; letter-spacing:.07em;
  padding:2px 6px; border-radius:4px; background:var(--brass-soft); color:var(--brass);
  align-self:flex-start; margin-top:3px;
}
.tag.min{background:var(--teal-soft); color:var(--teal)}

.blk.now{border-color:var(--brass)}
.blk.now::after{
  content:"지금"; position:absolute; right:11px; top:10px;
  font-family:var(--mono); font-size:9.5px; letter-spacing:.1em; color:var(--brass);
}
.lean .blk[data-kind="flex"]{opacity:.5}

.marker{
  display:grid; grid-template-columns:52px 1fr; gap:10px; align-items:center; margin-top:2px;
}
.marker .lab{
  font-family:inherit; font-size:14px; width:100%; text-align:left; cursor:pointer;
  display:flex; align-items:center; gap:9px; font-size:14px; font-weight:500;
  padding:9px 13px; border-radius:11px; border:1px dashed var(--brass); color:var(--brass);
  background:var(--brass-soft);
}

.marker .lab .box{border-color:var(--brass)}
.marker .lab.done .box{background:var(--done); border-color:var(--done)}
.marker .lab.done{opacity:.62}
.marker .lab:focus-visible{outline:2px solid var(--brass); outline-offset:2px}

/* ---------- panels ---------- */
.panel{
  background:var(--surface); border:1px solid var(--line); border-radius:12px;
  padding:15px 16px; display:flex; flex-direction:column; gap:12px; box-shadow:var(--shadow);
}
.toggle{display:flex; align-items:center; justify-content:space-between; gap:12px; cursor:pointer}
.toggle .lbl{display:flex; flex-direction:column; gap:2px}
.toggle .lbl b{font-size:14px; font-weight:500}
.toggle .lbl span{font-size:12px; color:var(--muted); font-weight:300}
.sw{width:40px; height:23px; border-radius:99px; background:var(--line); position:relative; flex:none; transition:.18s; border:none; cursor:pointer; padding:0}
.sw::after{content:""; position:absolute; top:3px; left:3px; width:17px; height:17px; border-radius:50%; background:var(--surface); transition:.18s; box-shadow:0 1px 3px rgba(0,0,0,.3)}
.sw[aria-pressed="true"]{background:var(--teal)}
.sw[aria-pressed="true"]::after{transform:translateX(17px)}
.sw:focus-visible{outline:2px solid var(--brass); outline-offset:2px}

.cal{display:flex; flex-direction:column; gap:8px}
.calrow{
  display:flex; align-items:flex-start; gap:10px; padding:9px 11px; border-radius:9px;
  background:var(--surface-2); border:1px solid var(--line-soft);
}
.calrow.on{border-color:var(--brass); background:var(--brass-soft)}
.calrow .when{
  font-family:var(--mono); font-size:11px; color:var(--faint); flex:none; width:46px;
  font-variant-numeric:tabular-nums; padding-top:2px; line-height:1.35;
}
.calrow.on .when{color:var(--brass)}
.calrow .what{flex:1; min-width:0; font-size:13.5px; line-height:1.4}
.calrow .what b{font-weight:500; display:block; word-break:break-word}
.calrow .what em{font-style:normal; font-size:11.5px; color:var(--muted); font-weight:300}
.calbtn{
  font-family:var(--mono); font-size:10.5px; letter-spacing:.03em; padding:6px 9px;
  border-radius:7px; border:1px solid var(--brass); background:transparent; color:var(--brass);
  cursor:pointer; flex:none; align-self:center; white-space:nowrap;
}
.calbtn:hover{background:var(--brass); color:var(--bg)}
.calbtn:focus-visible{outline:2px solid var(--brass); outline-offset:2px}
.todoItem{
  display:flex; align-items:flex-start; gap:10px; width:100%; text-align:left; cursor:pointer;
  font-family:inherit; color:inherit; font-size:13.5px; line-height:1.4;
  padding:9px 11px; border-radius:9px; background:var(--surface-2); border:1px solid var(--line-soft);
}
.todoItem:hover{border-color:var(--faint)}
.todoItem:focus-visible{outline:2px solid var(--brass); outline-offset:2px}
.todoItem.done{opacity:.55}
.todoItem.done b{text-decoration:line-through}
.todoItem .box{margin-top:0}
.todoItem .what{flex:1; min-width:0}
.todoWrap{display:flex; align-items:center; gap:6px}
.todoWrap .todoItem{flex:1}
.del{
  background:none; border:none; color:var(--faint); cursor:pointer; font-size:15px; line-height:1;
  padding:6px 7px; border-radius:6px; flex:none;
}
.del:hover{color:var(--text); background:var(--surface-2)}
.del:focus-visible{outline:2px solid var(--brass); outline-offset:2px}
.addRow{display:flex; gap:8px}
.addRow input{
  flex:1; min-width:0; background:var(--surface-2); border:1px solid var(--line-soft);
  border-radius:8px; padding:9px 11px; font-family:var(--sans); font-size:13.5px; color:var(--text);
}
.addRow input::placeholder{color:var(--faint); font-weight:300}
.addRow input:focus{outline:none; border-color:var(--brass); background:var(--surface)}

.calnote{margin:0; font-size:12.5px; color:var(--muted); font-weight:300; line-height:1.5}
.ro{
  font-family:var(--mono); font-size:9.5px; letter-spacing:.08em; color:var(--faint);
  border:1px solid var(--line); padding:2px 6px; border-radius:4px;
}

.shootRow{display:flex; gap:10px; flex-wrap:wrap}
.shootRow label{
  display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--muted);
  background:var(--surface-2); border:1px solid var(--line-soft); border-radius:8px; padding:7px 11px;
}
.shootRow input, .shootRow select{
  font-family:var(--mono); font-size:13px; color:var(--text); background:transparent;
  border:none; padding:0; font-variant-numeric:tabular-nums;
}
.shootRow input:focus, .shootRow select:focus{outline:none}
.shootRow label:focus-within{border-color:var(--brass)}
.hintline{font-size:12.5px; color:var(--muted); font-weight:300; line-height:1.5}

.lines{display:flex; flex-direction:column; gap:8px}
.lineRow{display:flex; align-items:center; gap:10px}
.lineRow .n{font-family:var(--mono); font-size:11px; color:var(--faint); width:12px; flex:none}
.lineRow input{
  flex:1; min-width:0; background:var(--surface-2); border:1px solid var(--line-soft);
  border-radius:8px; padding:9px 11px; font-family:var(--sans); font-size:13.5px;
  color:var(--text); transition:.15s;
}
.lineRow input::placeholder{color:var(--faint); font-weight:300}
.lineRow input:focus{outline:none; border-color:var(--brass); background:var(--surface)}

.week{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
.day{
  display:flex; flex-direction:column; align-items:center; gap:6px;
  padding:9px 2px; border-radius:9px; background:var(--surface-2); border:1px solid transparent;
}
.day.today{border-color:var(--brass)}
.day .d{font-family:var(--mono); font-size:10.5px; color:var(--faint)}
.day .ring{
  width:26px; height:26px; border-radius:50%; display:grid; place-items:center;
  font-family:var(--mono); font-size:10.5px; font-variant-numeric:tabular-nums;
  color:var(--muted);
}
.day .ring b{font-weight:500}

.foot{
  display:flex; justify-content:space-between; align-items:center; gap:12px;
  font-family:var(--mono); font-size:11px; color:var(--faint); letter-spacing:.03em;
  padding-top:2px;
}
.reset{
  background:none; border:none; font-family:var(--mono); font-size:11px; letter-spacing:.05em;
  color:var(--faint); cursor:pointer; padding:4px 8px; border-radius:6px;
}
.reset:hover{color:var(--text); background:var(--surface-2)}
.sync{display:flex; align-items:center; gap:6px}
.sync .dot{width:6px; height:6px; border-radius:50%; background:var(--faint)}
.sync.ok .dot{background:var(--done)}

@media (prefers-reduced-motion:reduce){*{transition:none !important; animation:none !important}}
@media (max-width:400px){
  .row,.marker{grid-template-columns:44px 1fr; gap:8px}
  h1{font-size:24px}
}
</style>
<style>
/* 아티팩트 틀이 대신 해주던 기본값 — 혼자 서는 문서라 여기서 직접 깔아둡니다 */
html{-webkit-text-size-adjust:100%}
body{margin:0}
img{max-width:100%}
[hidden]{display:none !important}
/* 아이폰 노치·홈바를 피해서 여백을 줍니다 */
.wrap{
  padding-top:calc(22px + env(safe-area-inset-top));
  padding-bottom:calc(64px + env(safe-area-inset-bottom));
}
</style>
</head>
<body>
<div class="wrap">
  <header class="head">
    <div>
      <div class="datebar">
        <button class="nav" id="prevDay" aria-label="하루 전">‹</button>
        <span class="date" id="date"></span>
        <button class="nav" id="nextDay" aria-label="하루 뒤">›</button>
        <span class="rel" id="rel"></span>
        <button class="chip" id="todayBtn" hidden>오늘로</button>
      </div>
      <h1 id="title">하루 운영표</h1>
    </div>
    <div class="modes" id="modes"></div>
  </header>

  <section class="spine">
    <div class="spine-hd">
      <span class="eyebrow">절대 고정</span>
      <span class="spine-count" id="progressText">0 / 0</span>
    </div>
    <div class="anchors" id="anchors"></div>
    <div class="bar"><i id="progressBar"></i></div>
  </section>

  <section class="panel" id="calBox" hidden>
    <div class="spine-hd">
      <span class="eyebrow">구글 캘린더</span>
      <span class="ro">읽기 전용</span>
    </div>
    <div class="cal" id="calBody"><p class="calnote">불러오는 중…</p></div>
  </section>

  <section class="panel" id="shootBox" hidden>
    <span class="eyebrow">콜타임 역산</span>
    <div class="shootRow">
      <label>콜타임 <input type="time" id="callTime" value="10:00"></label>
      <label>이동
        <select id="travel">
          <option value="30">30분</option>
          <option value="60" selected>1시간</option>
          <option value="90">1시간 30분</option>
          <option value="120">2시간</option>
        </select>
      </label>
    </div>
    <p class="hintline" id="shootHint"></p>
  </section>

  <main class="tl" id="timeline"></main>

  <section class="panel" id="todoBox">
    <div class="spine-hd">
      <span class="eyebrow">오늘 할일</span>
      <span class="spine-count" id="todoCount"></span>
    </div>
    <div class="cal" id="todoBody"></div>
    <form class="addRow" id="addForm">
      <input type="text" id="addInput" placeholder="직접 추가" autocomplete="off">
      <button type="submit" class="calbtn">추가</button>
    </form>
  </section>

  <section class="panel">
    <div class="toggle" id="leanRow">
      <span class="lbl">
        <b>컨디션 나쁜 날</b>
        <span>최저선만 지키기 — 헬스는 가서 샤워라도</span>
      </span>
      <button class="sw" id="lean" aria-pressed="false" aria-label="컨디션 나쁜 날 모드"></button>
    </div>
  </section>

  <section class="panel">
    <span class="eyebrow">내일 3줄 · 20:30 작성</span>
    <div class="lines" id="lines"></div>
  </section>

  <section class="panel">
    <span class="eyebrow">지난 7일</span>
    <div class="week" id="week"></div>
  </section>

  <div class="foot">
    <span class="sync" id="sync"><i class="dot"></i><span id="syncText">이 기기에만 저장</span></span>
    <button class="reset" id="reset">오늘 초기화</button>
  </div>
</div>

<script>
(function(){
  "use strict";
  var $ = function(s){ return document.querySelector(s); };
  var pad = function(n){ return String(n).padStart(2,"0"); };
  var DOW = ["일","월","화","수","목","금","토"];

  // ---- 날짜를 "2026-09-08" 같은 글자로 바꿔주는 기계 ----
  function keyOf(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function toMin(t){ var p = t.split(":"); return (+p[0])*60 + (+p[1]); }

  var REAL_NOW  = new Date();                 // 진짜 지금 (시각 표시·'지금' 칸 판정용)
  var TODAY_KEY = keyOf(REAL_NOW);
  var NOW_DATE  = new Date(REAL_NOW.getFullYear(), REAL_NOW.getMonth(), REAL_NOW.getDate());
  var DATE_KEY  = keyOf(NOW_DATE);             // 지금 보고 있는 날 (앞뒤로 옮길 수 있음)

  // ---- 하루 계획표 원본. 요일에 따라 셋 중 하나를 씀 ----
  var PLANS = {
    weekday: { label:"평일", hint:"월 · 수 · 목 · 금", blocks:[
      {id:"morning", s:"07:00", e:"08:00", t:"아침식사 + 개인정비", sub:"07:00 기상", kind:"anchor"},

      {id:"lunch",   s:"10:30", e:"11:15", t:"점심",               sub:"집 도착 즉시 — 운동 직후 영양섭취", kind:"anchor"},

      {id:"snack",   s:"14:10", e:"15:10", t:"간식 + 휴식",         sub:"점심과 저녁 사이를 메우는 끼니", kind:"core"},
      {id:"studio",  s:"15:10", e:"18:00", t:"스튜디오 노래연습",    sub:"연습 15:20–17:50 + 왕복 20분", kind:"flex", min:"건너뛰어도 됨"},
      {id:"dinner",  s:"18:00", e:"19:00", t:"저녁", kind:"core"},
      {id:"work2",   s:"19:00", e:"20:30", t:"할일 ②",            sub:"이동 없는 시간 — 캐스팅 지원 · 학원 업무", kind:"core"},
      {id:"wrap",    s:"20:30", e:"21:00", t:"마무리 + 내일 3줄",   sub:"손으로 하는 일만 — 머리 식히는 30분", kind:"core"},
      {id:"wind",    s:"21:00", e:"22:00", t:"이완 / 취침 준비",    sub:"노트북 21:00 종료", kind:"anchor"},
      {id:"sleep",   s:"22:00", e:null,   t:"취침", kind:"anchor", marker:true}

    tuesday: { label:"화요일", hint:"레슨 있는 날", blocks:[
      {id:"morning", s:"07:00", e:"08:00", t:"아침식사 + 개인정비", sub:"07:00 기상", kind:"anchor"},
      {id:"gym",     s:"08:00", e:"10:30", t:"헬스",               sub:"왕복 20분 · 실운동 2시간 10분", kind:"anchor", min:"가서 샤워라도 하고 오기"},
      {id:"lunch",   s:"10:30", e:"11:15", t:"점심",               sub:"집 도착 즉시 — 운동 직후 영양섭취", kind:"anchor"},
      {id:"work1",   s:"11:15", e:"12:45", t:"집중 할일 ①",        sub:"머리가 제일 맑은 90분", kind:"core"},
      {id:"piano",   s:"12:50", e:"15:10", t:"피아노 — 레슨",       sub:"연습 13:00–14:00 · 레슨 14:00–15:00", kind:"anchor"},
      {id:"snack",   s:"15:10", e:"16:10", t:"간식 + 휴식",         sub:"레슨 끝나고 집에서", kind:"core"},
      {id:"studio",  s:"16:10", e:"19:00", t:"스튜디오 노래연습",    sub:"연습 16:20–18:50 + 왕복 20분", kind:"flex", min:"건너뛰어도 됨"},
      {id:"dinner",  s:"19:00", e:"20:00", t:"저녁", kind:"core"},
      {id:"work2",   s:"20:00", e:"21:00", t:"할일 ② + 내일 3줄",   sub:"화요일은 1시간 — 마지막 15분은 3줄", kind:"core"},
      {id:"wind",    s:"21:00", e:"22:00", t:"이완 / 취침 준비",    sub:"노트북 21:00 종료", kind:"anchor"},
      {id:"sleep",   s:"22:00", e:null,   t:"취침", kind:"anchor", marker:true}
    ]},
    weekend: { label:"주말", hint:"학원 근무 — 정자동", blocks:[
      {id:"morning", s:"07:00", e:"08:00", t:"아침식사 + 개인정비", sub:"07:00 기상 — 주말에도 같은 시각", kind:"anchor"},
      {id:"gym",     s:"08:00", e:"10:30", t:"헬스",               sub:"왕복 20분 · 실운동 2시간 10분", kind:"anchor", min:"가서 샤워라도 하고 오기"},
      {id:"lunch",   s:"10:30", e:"11:15", t:"점심",               sub:"집 도착 즉시 — 운동 직후 영양섭취", kind:"anchor"},
      {id:"work1",   s:"11:15", e:"12:30", t:"집중 할일 ①",        sub:"출근 전 75분", kind:"core"},
      {id:"leave",   s:"12:30", e:"13:30", t:"출발 · 이동",        sub:"도시락 챙기고 13:00 출발 — 신사동 → 정자동 30분", kind:"anchor", min:"간식만이라도 챙기기"},
      {id:"academy", s:"13:30", e:"22:00", t:"학원 근무",          sub:"수업 · 정리 · 청소 8시간 30분 — 16:00 간식 · 19:00 저녁", kind:"anchor"},
      {id:"back",    s:"22:00", e:"23:15", t:"퇴근 · 귀가 후 마무리", sub:"22:30 도착 — 씻고 정리, 가벼운 식사는 선택", kind:"core"},
      {id:"sleep",   s:"23:15", e:null,   t:"취침 — 주말 목표", kind:"anchor", marker:true}
    ]}
  };

  // ---- 요일을 보고 어떤 계획표를 쓸지 자동으로 고름 ----
  function autoMode(d){
    var w = d.getDay();
    if (w === 2) return "tuesday";       // 화요일은 레슨
    if (w === 0 || w === 6) return "weekend";
    return "weekday";
  }

  var state = { mode:null, done:{}, lines:["","",""], lean:false, call:"10:00", travel:60, todoDone:{}, extra:[] };
  var db = null, unsub = null, myStamp = null, saveTimer = null;
  var calState = {}, todoState = {};   // 캘린더에서 받아온 것을 담아두는 상자
  var mcpRef = null, calUnsubs = [];   // 날짜를 옮기면 캘린더도 다시 불러와야 해서 보관

  function activeMode(){ return state.mode || autoMode(NOW_DATE); }
  function plan(){ return activeMode() === "shoot" ? buildShoot() : PLANS[activeMode()]; }

  // 분 단위 숫자를 "13:30" 같은 글자로 되돌림
  function m2s(m){ m = ((m % 1440) + 1440) % 1440; return pad(Math.floor(m/60)) + ":" + pad(m%60); }

  // 콜타임에서 거꾸로 세어 그날 표를 만듦 — 출발 = 콜타임 - 이동, 기상 = 출발 - 준비 - 아침
  function buildShoot(){
    var call = toMin(state.call || "10:00");
    var travel = state.travel || 60;
    var PREP = 45;                       // 짐 챙기고 나갈 준비
    var leave = call - travel;           // 집에서 나서는 시각
    var wake = Math.min(420, leave - PREP - 60);   // 평소 07:00, 이른 콜이면 그만큼 앞당김
    var b = [], cur = wake;

    b.push({id:"morning", s:m2s(cur), e:m2s(cur+60), t:"아침식사 + 개인정비", sub:m2s(wake)+" 기상", kind:"anchor"});
    cur += 60;

    var free = leave - PREP - cur;       // 출발 준비 전까지 남는 시간
    if (free >= 150){
      b.push({id:"gym", s:m2s(cur), e:m2s(cur+150), t:"헬스", sub:"콜타임 전에 들어감", kind:"anchor", min:"가서 샤워라도 하고 오기"});
      cur += 150; free -= 150;
    } else {
      // 헬스가 안 들어가면 남는 시간을 통째로 이 칸이 차지하게 해서 뒤 칸과 겹치지 않게 합니다
      if (free > 0){
        b.push({id:"gymskip", s:m2s(cur), e:m2s(leave-PREP), t:"헬스 — 오늘은 촬영 후로",
                sub:"콜타임까지 2시간 30분이 안 나옴 — 남는 시간은 여유", kind:"flex"});
      }
      cur = leave - PREP; free = 0;
    }
    if (free >= 45){
      b.push({id:"lunch", s:m2s(cur), e:m2s(cur+45), t:"식사", sub:"나가기 전에 확실히", kind:"core"});
      cur += 45; free -= 45;
    }
    if (free >= 30){
      b.push({id:"work1", s:m2s(cur), e:m2s(cur+free), t:"집중 할일 ①", sub:"출발 전 남는 시간", kind:"core"});
      cur += free;
    }
    b.push({id:"prep",  s:m2s(leave-PREP), e:m2s(leave), t:"준비 · 짐 챙기기", sub:"의상 · 서류 · 간식 — 밖에서 먹을 것", kind:"core"});
    b.push({id:"move",  s:m2s(leave), e:m2s(call), t:"이동", sub:travel+"분 — "+m2s(leave)+" 출발", kind:"anchor"});
    b.push({id:"shoot", s:m2s(call), e:m2s(call+240), t:"촬영", sub:"콜타임 "+m2s(call)+" · 종료 미정", kind:"anchor"});
    b.push({id:"sleep", s:"—", e:null, t:"귀가 후 취침 — 내일 07:00 기상 복귀", kind:"anchor", marker:true});

    return { label:"촬영", hint:"콜타임 "+m2s(call), blocks:b, shoot:true, leave:leave, wake:wake };
  }

  // ---------- 저장 / 불러오기 ----------
  function LSKEY(){ return "routine:" + DATE_KEY; }
  function payload(){
    return { date:DATE_KEY, mode:state.mode, done:state.done, lines:state.lines, lean:state.lean, call:state.call, travel:state.travel, todoDone:state.todoDone, extra:state.extra, stamp:myStamp };
  }
  function apply(d){
    if (!d) return;
    state.mode  = d.mode || null;
    state.done  = (d.done && typeof d.done === "object") ? d.done : {};
    state.lines = Array.isArray(d.lines) ? d.lines.slice(0,3) : ["","",""];
    while (state.lines.length < 3) state.lines.push("");
    state.lean  = !!d.lean;
    state.call  = d.call || "10:00";
    state.travel = +d.travel || 60;
    state.todoDone = (d.todoDone && typeof d.todoDone === "object") ? d.todoDone : {};
    state.extra = Array.isArray(d.extra) ? d.extra : [];
  }
  function save(){
    myStamp = String(Date.now()) + "-" + Math.random().toString(36).slice(2,7);
    var p = payload();
    try { localStorage.setItem(LSKEY(), JSON.stringify(p)); } catch(e){}
    if (!db) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){
      db.doc("days/" + DATE_KEY).set(p).catch(function(){});
    }, 350);
  }

  // ---------- 그리기 ----------
  var CHECK = '<svg viewBox="0 0 12 12"><path d="M2 6.4 4.6 9 10 3"/></svg>';

  function fmtDur(a,b){
    var m = toMin(b) - toMin(a);
    var h = Math.floor(m/60), r = m%60;
    return (h ? h+"시간" : "") + (r ? (h?" ":"")+r+"분" : "");
  }

  function renderHead(){
    $("#date").textContent = DATE_KEY.replace(/-/g,".");
    $("#rel").textContent = relLabel(DATE_KEY);
    $("#todayBtn").hidden = (DATE_KEY === TODAY_KEY);
    var p = plan();
    // 오늘이 화요일인데 표도 '화요일'이면 같은 말이 두 번 나오므로 하나만 씁니다
    var dow = DOW[NOW_DATE.getDay()] + "요일";
    $("#title").innerHTML = '<span class="dow">' + dow + '</span>' + (p.label === dow ? '' : ' · ' + p.label);

    var modes = $("#modes");
    modes.innerHTML = "";
    var opts = [["", "자동"], ["weekday","평일"], ["tuesday","화요일"], ["weekend","주말"], ["shoot","촬영"]];
    opts.forEach(function(o){
      var b = document.createElement("button");
      b.className = "chip" + (o[0] === "" ? " auto" : "");
      b.textContent = o[1];
      b.setAttribute("aria-pressed", String((state.mode || "") === o[0]));
      b.onclick = function(){ state.mode = o[0] || null; save(); render(); };
      modes.appendChild(b);
    });
  }

  function renderSpine(){
    var blocks = plan().blocks;
    var anchors = blocks.filter(function(b){ return b.kind === "anchor"; });
    var box = $("#anchors");
    box.innerHTML = "";
    anchors.forEach(function(b){
      var el = document.createElement("div");
      el.className = "anchor" + (state.done[b.id] ? " on" : "");
      el.innerHTML = '<i class="pip"></i><span>' + b.t + '</span><span class="at">' + b.s + '</span>';
      box.appendChild(el);
    });
    var all = blocks.length;
    var n = blocks.filter(function(b){ return state.done[b.id]; }).length;
    $("#progressText").textContent = n + " / " + all;
    $("#progressBar").style.width = (all ? Math.round(n/all*100) : 0) + "%";
  }

  function renderTimeline(){
    var tl = $("#timeline");
    tl.innerHTML = "";
    tl.className = "tl" + (state.lean ? " lean" : "");
    var nowMin = REAL_NOW.getHours()*60 + REAL_NOW.getMinutes();
    var isToday = DATE_KEY === TODAY_KEY;

    plan().blocks.forEach(function(b){
      if (b.marker){
        var m = document.createElement("div");
        m.className = "marker";
        m.innerHTML = '<div class="rail">' + b.s + '</div>';
        var mb = document.createElement("button");
        mb.type = "button";
        mb.className = "lab" + (state.done[b.id] ? " done" : "");
        mb.setAttribute("aria-pressed", String(!!state.done[b.id]));
        mb.innerHTML = '<span class="box">' + CHECK + '</span><span>' + b.t + '</span>';
        mb.onclick = function(){
          state.done[b.id] = !state.done[b.id];
          if (!state.done[b.id]) delete state.done[b.id];
          save(); render();
        };
        m.appendChild(mb);
        tl.appendChild(m);
        return;
      }
      var row = document.createElement("div");
      row.className = "row";

      var rail = document.createElement("div");
      rail.className = "rail";
      rail.innerHTML = '<span>' + b.s + '</span><span class="end">' + b.e + '</span>';

      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "blk" + (state.done[b.id] ? " done" : "");
      btn.dataset.kind = b.kind;
      btn.style.setProperty("--dur", Math.min(240, toMin(b.e) - toMin(b.s)));
      btn.setAttribute("aria-pressed", String(!!state.done[b.id]));

      // 컨디션 나쁜 날에는 설명 대신 '최저선' 문구를 보여줌
      var sub = (state.lean && b.min) ? b.min : b.sub;
      var tag = (state.lean && b.min) ? '<span class="tag min">최저선</span>' : "";

      btn.innerHTML =
        '<span class="box">' + CHECK + '</span>' +
        '<span class="body">' +
          '<span class="t">' + b.t + '</span>' +
          (sub ? '<span class="s">' + sub + '</span>' : '') +
          '<span class="dur">' + fmtDur(b.s, b.e) + '</span>' +
          tag +
        '</span>';

      if (isToday && nowMin >= toMin(b.s) && nowMin < toMin(b.e)) btn.classList.add("now");

      btn.onclick = function(){
        state.done[b.id] = !state.done[b.id];
        if (!state.done[b.id]) delete state.done[b.id];
        save(); render();
      };

      row.appendChild(rail);
      row.appendChild(btn);
      tl.appendChild(row);
    });
  }

  function renderLines(){
    var box = $("#lines");
    if (box.dataset.built === "1"){
      Array.prototype.forEach.call(box.querySelectorAll("input"), function(inp, i){
        if (document.activeElement !== inp) inp.value = state.lines[i] || "";
      });
      return;
    }
    box.dataset.built = "1";
    var ph = ["내일 꼭 할 일 하나", "그다음 하나", "여유 있으면 하나"];
    for (var i = 0; i < 3; i++){
      (function(i){
        var row = document.createElement("div");
        row.className = "lineRow";
        var n = document.createElement("span"); n.className = "n"; n.textContent = (i+1) + ".";
        var inp = document.createElement("input");
        inp.type = "text"; inp.placeholder = ph[i]; inp.value = state.lines[i] || "";
        inp.oninput = function(){ state.lines[i] = inp.value; save(); };
        row.appendChild(n); row.appendChild(inp);
        box.appendChild(row);
      })(i);
    }
  }

  function renderLean(){
    $("#lean").setAttribute("aria-pressed", String(state.lean));
  }

  function renderShoot(){
    var on = activeMode() === "shoot";
    $("#shootBox").hidden = !on;
    if (!on) return;
    var ct = $("#callTime"), tv = $("#travel");
    if (document.activeElement !== ct) ct.value = state.call || "10:00";
    tv.value = String(state.travel || 60);
    var p = plan();
    $("#shootHint").textContent =
      m2s(p.wake) + " 기상 · " + m2s(p.leave) + " 출발. 오늘 지킬 건 이것뿐이고, 내일 07:00 기상으로 돌아오면 됩니다.";
  }

  // 보고 있는 날이 오늘에서 며칠 떨어졌는지 한글로
  function relLabel(k){
    var a = new Date(k + "T00:00:00"), b = new Date(TODAY_KEY + "T00:00:00");
    var diff = Math.round((a - b) / 86400000);
    if (diff === 0) return "오늘";
    if (diff === 1) return "내일";
    if (diff === 2) return "모레";
    if (diff === -1) return "어제";
    return (diff > 0 ? "+" : "") + diff + "일";
  }
  function rebuildLines(){ var b = $("#lines"); b.dataset.built = ""; b.innerHTML = ""; }

  // 다른 날짜로 옮기기 — 계획표·캘린더·저장기록이 모두 그 날 기준으로 다시 채워집니다
  function switchTo(key, d){
    if (key === DATE_KEY) return;
    NOW_DATE = d; DATE_KEY = key; myStamp = null;
    state = { mode:null, done:{}, lines:["","",""], lean:false,
              call:"10:00", travel:60, todoDone:{}, extra:[] };
    try { var c = localStorage.getItem(LSKEY()); if (c) apply(JSON.parse(c)); } catch(e){}
    rebuildLines(); render();
    subscribeDay(); refreshWeek(); startCals();
  }
  function shiftDay(n){
    var d = new Date(NOW_DATE.getFullYear(), NOW_DATE.getMonth(), NOW_DATE.getDate() + n);
    switchTo(keyOf(d), d);
  }

  // 서버 저장소에서 그날 기록을 듣기 시작 (날짜를 옮기면 다시 겁니다)
  function subscribeDay(){
    if (!db) return;
    if (unsub){ try { unsub(); } catch(e){} unsub = null; }
    var k = DATE_KEY;
    unsub = db.doc("days/" + k).onSnapshot(function(snap){
      if (k !== DATE_KEY) return;                 // 날짜를 옮긴 뒤 늦게 온 것은 버림
      if (snap.metadata.hasPendingWrites) return;
      var d = snap.data();
      if (!d || d.stamp === myStamp) return;
      apply(d); rebuildLines(); render();
    }, function(){
      $("#sync").classList.remove("ok");
      $("#syncText").textContent = "이 기기에만 저장";
    });
  }

  function refreshWeek(){
    if (!db){ renderWeek({}); return; }
    var keys = [], k = DATE_KEY;
    for (var i = 6; i >= 0; i--){
      var d2 = new Date(NOW_DATE.getFullYear(), NOW_DATE.getMonth(), NOW_DATE.getDate() - i);
      keys.push(keyOf(d2));
    }
    Promise.all(keys.map(function(kk){
      return db.doc("days/" + kk).get()
               .then(function(sn){ return sn.exists ? { k:kk, v:sn.data() } : null; })
               .catch(function(){ return null; });
    })).then(function(rows){
      if (k !== DATE_KEY) return;
      var recs = {};
      rows.forEach(function(r){ if (r) recs[r.k] = r.v; });
      renderWeek(recs);
    });
  }

  function render(){ renderHead(); renderShoot(); renderSpine(); renderTimeline(); renderTodo(); renderLines(); renderLean(); }

  // ---------- 지난 7일 ----------
  function renderWeek(records){
    var box = $("#week");
    box.innerHTML = "";
    for (var i = 6; i >= 0; i--){
      var d = new Date(NOW_DATE.getFullYear(), NOW_DATE.getMonth(), NOW_DATE.getDate() - i);
      var k = keyOf(d);
      var rec = records[k];
      var pl = PLANS[(rec && rec.mode) || autoMode(d)];
      var total = pl ? pl.blocks.length : 8;
      var done = rec && rec.done ? Object.keys(rec.done).length : 0;
      var pct = total ? done/total : 0;

      var el = document.createElement("button");
      el.type = "button";
      el.className = "day" + (k === DATE_KEY ? " today" : "");
      el.setAttribute("aria-label", k);
      (function(kk, dd){ el.onclick = function(){ switchTo(kk, dd); }; })(k, d);
      var deg = Math.round(pct * 360);
      var ring = done
        ? '<span class="ring" style="background:conic-gradient(var(--brass) ' + deg + 'deg, var(--line-soft) 0)"></span>'
        : '<span class="ring" style="background:var(--line-soft)"></span>';
      el.innerHTML = '<span class="d">' + DOW[d.getDay()] + '</span>' + ring +
                     '<span class="d">' + (done || "·") + '</span>';
      box.appendChild(el);
    }
  }

  // ---------- 시작 ----------
  try {
    var cached = localStorage.getItem(LSKEY());
    if (cached) apply(JSON.parse(cached));
  } catch(e){}
  render();
  renderWeek({});

  $("#prevDay").onclick  = function(){ shiftDay(-1); };
  $("#nextDay").onclick  = function(){ shiftDay(1); };
  $("#todayBtn").onclick = function(){
    var t = new Date(REAL_NOW.getFullYear(), REAL_NOW.getMonth(), REAL_NOW.getDate());
    switchTo(TODAY_KEY, t);
  };
  $("#callTime").oninput = function(){ state.call = this.value || "10:00"; save(); render(); };
  $("#travel").onchange  = function(){ state.travel = +this.value; save(); render(); };
  $("#lean").onclick = function(){ state.lean = !state.lean; save(); render(); };
  $("#leanRow").onclick = function(e){ if (e.target.id !== "lean"){ state.lean = !state.lean; save(); render(); } };
  $("#reset").onclick = function(){
    state.done = {}; state.lines = ["","",""]; state.lean = false;
    state.todoDone = {}; state.extra = [];
    rebuildLines();
    save(); render();
  };

  // ---------- 구글 캘린더 읽어오기 (쓰기 도구는 아예 선언하지 않음) ----------
  // 촬영일정 = 촬영표를 만드는 데 씀
  var CALS = [
    { id:"jsp2rc8g0bfeojcs771m51abj0@group.calendar.google.com", name:"촬영" }
  ];
  // 나머지 캘린더 = 아래 '오늘 할일' 칸에 오늘 것만 들어감
  // (공휴일 캘린더와 '효진 수업스케줄'은 할일이 아니라서 뺐습니다)
  var TODO_CALS = [
    { id:"hugh9848@gmail.com",                                   name:"개인" },
    { id:"nncp8vkejmi677a7i2cpv5mlq8@group.calendar.google.com", name:"미팅/오디션" },
    { id:"ngf14c15imbmrbg0u133840000@group.calendar.google.com", name:"효진" },
    { id:"j12goh8p17etofli0m59c1g6us@group.calendar.google.com", name:"병원/관리" },
    { id:"0isle1jcfa60vpkb2vq2gkksr0@group.calendar.google.com", name:"관람/PT/승마" },
    { id:"family15908586415953656664@group.calendar.google.com", name:"가족" },
    { id:"b5affo6ug5mqv8729nln3mlbcg@group.calendar.google.com", name:"여행" }
  ];

  // 제목에 적힌 콜타임을 찾아냄 — "2시 샥즈광고" 처럼 시각이 제목에 들어 있는 경우가 많음
  function pickTime(title){
    var s = String(title || "");
    var pm = /오후|저녁|밤/.test(s), am = /오전|새벽/.test(s);
    var m = s.match(/(\d{1,2})\s*(?::|시)\s*(\d{1,2})?/);
    if (!m) return null;
    var h = +m[1], mi = m[2] ? +m[2] : 0;
    if (h > 23 || mi > 59) return null;
    if (pm && h < 12) h += 12;
    else if (am && h === 12) h = 0;
    else if (!pm && !am && h >= 1 && h <= 7) h += 12;   // 촬영 콜타임이 새벽 1~7시일 일은 드묾
    return pad(h) + ":" + pad(mi);
  }

  function startKey(ev){ var a = ev.start || {}; return String(a.dateTime || a.date || "").slice(0,10); }
  function startClock(ev){ var a = ev.start || {}; return a.dateTime ? String(a.dateTime).slice(11,16) : null; }
  function coversToday(ev, key){
    var a = ev.start || {}, b = ev.end || {};
    var sd = startKey(ev);
    if (!sd) return false;
    if (a.dateTime) return sd === key;                 // 시각이 있는 일정은 그날 하루
    var ed = String(b.date || b.dateTime || "").slice(0,10);
    if (!ed || ed <= sd) return sd === key;            // 종일 하루짜리
    return key >= sd && key < ed;                      // 종일 여러 날 (끝날짜는 미포함)
  }

  function calErrMsg(e){
    switch (e && e.code){
      case "needs_reauth":
        return "구글 캘린더 연결이 만료됐습니다. claude.ai 설정 → 커넥터에서 다시 연결해 주세요.";
      case "server_not_connected":
        return "구글 캘린더 커넥터가 연결돼 있지 않습니다. claude.ai 설정 → 커넥터에서 추가해 주세요.";
      case "selection_required":
        return "연결된 구글 캘린더가 여러 개입니다. 어느 것을 쓸지 한 번 골라 주세요.";
      case "blocked_by_policy":
      case "approval_required":
        return "조직 정책으로 캘린더 읽기가 막혀 있습니다.";
      case "not_in_manifest":
        return "이 페이지에 캘린더 읽기 권한이 없습니다.";
      case "server_unavailable":
        return "구글 캘린더가 잠시 응답하지 않습니다. 잠시 후 다시 시도됩니다.";
      default:
        return "캘린더를 불러오지 못했습니다" + (e && e.code ? " (" + e.code + ")" : "") + ".";
    }
  }

  function calRow(x, isToday){
    var ev = x.ev, clock = startClock(ev), call = clock || pickTime(ev.summary);
    var when = isToday ? "오늘" : startKey(ev).slice(5).replace("-", "/");
    var sub = x.cal + (clock ? "" : " · 종일");
    var btn = call
      ? '<button class="calbtn" data-call="' + call + '">촬영표 ' + call + '</button>'
      : '<button class="calbtn" data-call="">촬영표</button>';
    return '<div class="calrow' + (isToday ? " on" : "") + '">' +
             '<span class="when">' + when + (clock ? "<br>" + clock : "") + '</span>' +
             '<span class="what"><b>' + esc(ev.summary || "(제목 없음)") + '</b><em>' + esc(sub) + '</em></span>' +
             btn +
           '</div>';
  }
  function esc(t){
    return String(t == null ? "" : t)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  function renderCal(){
    var names = Object.keys(calState);
    if (!names.length) return;
    $("#calBox").hidden = false;
    var body = $("#calBody");

    var errs = [], all = [];
    names.forEach(function(n){
      var st = calState[n];
      if (st.err) errs.push(st.err);
      (st.events || []).forEach(function(e){ if (e && e.status !== "cancelled") all.push({ cal:n, ev:e }); });
    });

    if (errs.length === names.length && !all.length){
      body.innerHTML = '<p class="calnote">' + calErrMsg(errs[0]) + '</p>';
      return;
    }

    var today = [], soon = [];
    all.forEach(function(x){
      if (coversToday(x.ev, DATE_KEY)) today.push(x);
      else if (startKey(x.ev) > DATE_KEY) soon.push(x);
    });
    soon.sort(function(a,b){ return startKey(a.ev) < startKey(b.ev) ? -1 : 1; });
    soon = soon.slice(0, 4);

    var html = "";
    if (!today.length && !soon.length){
      html += '<p class="calnote">앞으로 4주간 잡힌 촬영·미팅이 없습니다.</p>';
    }
    today.forEach(function(x){ html += calRow(x, true); });
    if (soon.length){
      html += '<p class="calnote">다가오는 일정</p>';
      soon.forEach(function(x){ html += calRow(x, false); });
    }
    if (errs.length) html += '<p class="calnote">' + calErrMsg(errs[0]) + '</p>';
    body.innerHTML = html;

    Array.prototype.forEach.call(body.querySelectorAll(".calbtn"), function(b){
      b.onclick = function(){
        state.mode = "shoot";
        if (b.getAttribute("data-call")) state.call = b.getAttribute("data-call");
        save(); render();
        var box = $("#shootBox");
        if (box && box.scrollIntoView) box.scrollIntoView({ behavior:"smooth", block:"center" });
      };
    });
  }

  function renderTodo(){
    var body = $("#todoBody");
    if (!body) return;
    var items = [], errs = [];

    Object.keys(todoState).forEach(function(n){
      var st = todoState[n];
      if (st.err) errs.push(st.err);
      (st.events || []).forEach(function(e){
        if (!e || e.status === "cancelled") return;
        if (!coversToday(e, DATE_KEY)) return;                    // 오늘 것만
        items.push({ key:"cal:" + e.id, title:e.summary || "(제목 없음)",
                     clock:startClock(e), from:n, cal:true });
      });
    });
    items.sort(function(a,b){ return (a.clock || "99") < (b.clock || "99") ? -1 : 1; });

    (state.extra || []).forEach(function(x){
      items.push({ key:x.id, title:x.t, clock:null, from:"직접 추가", cal:false });
    });

    var done = items.filter(function(i){ return state.todoDone[i.key]; }).length;
    $("#todoCount").textContent = items.length ? done + " / " + items.length : "";

    if (!items.length){
      body.innerHTML = '<p class="calnote">' +
        (errs.length ? calErrMsg(errs[0]) : "오늘 캘린더에 잡힌 일정이 없습니다. 아래에 직접 적어도 됩니다.") +
        '</p>';
      return;
    }

    var html = "";
    items.forEach(function(i){
      var meta = (i.clock ? i.clock + " · " : "") + i.from;
      var btn = '<button type="button" class="todoItem' + (state.todoDone[i.key] ? " done" : "") + '"' +
                ' data-k="' + esc(i.key) + '" aria-pressed="' + (!!state.todoDone[i.key]) + '">' +
                  '<span class="box">' + CHECK + '</span>' +
                  '<span class="what"><b>' + esc(i.title) + '</b><em>' + esc(meta) + '</em></span>' +
                '</button>';
      html += i.cal ? btn
            : '<div class="todoWrap">' + btn +
              '<button type="button" class="del" data-del="' + esc(i.key) + '" aria-label="지우기">✕</button></div>';
    });
    if (errs.length) html += '<p class="calnote">' + calErrMsg(errs[0]) + '</p>';
    body.innerHTML = html;

    Array.prototype.forEach.call(body.querySelectorAll(".todoItem"), function(b){
      b.onclick = function(){
        var k = b.getAttribute("data-k");
        if (state.todoDone[k]) delete state.todoDone[k]; else state.todoDone[k] = true;
        save(); renderTodo();
      };
    });
    Array.prototype.forEach.call(body.querySelectorAll(".del"), function(b){
      b.onclick = function(){
        var k = b.getAttribute("data-del");
        state.extra = (state.extra || []).filter(function(x){ return x.id !== k; });
        delete state.todoDone[k];
        save(); renderTodo();
      };
    });
  }

  $("#addForm").onsubmit = function(e){
    e.preventDefault();
    var inp = $("#addInput"), t = inp.value.trim();
    if (!t) return;
    state.extra = state.extra || [];
    state.extra.push({ id:"x" + Date.now().toString(36), t:t });
    inp.value = "";
    save(); renderTodo();
  };

  function initTodoCals(mcp){
    var from = new Date(NOW_DATE.getFullYear(), NOW_DATE.getMonth(), NOW_DATE.getDate());
    var to   = new Date(NOW_DATE.getFullYear(), NOW_DATE.getMonth(), NOW_DATE.getDate() + 1);
    TODO_CALS.forEach(function(c){
      todoState[c.name] = { err:null, events:[] };
      calUnsubs.push(mcp.watchTool("Google Calendar", "list_events", {
        calendarId: c.id,
        startTime: keyOf(from) + "T00:00:00+09:00",
        endTime:   keyOf(to)   + "T23:59:59+09:00",
        orderBy: "startTime",
        pageSize: 25
      }, function(e){
        if (e.type === "error"){
          todoState[c.name].err = e.error;
          var hard = { needs_reauth:1, server_not_connected:1, blocked_by_policy:1, approval_required:1, not_in_manifest:1 };
          if (hard[e.error && e.error.code]) todoState[c.name].events = [];
        } else {
          var pl = e.result && e.result.payload;
          todoState[c.name] = { err:null, events:(pl && pl.events) || [] };
        }
        renderTodo();
      }, { refetchInterval: 600000 }));
    });
  }

  function initCal(mcp){
    var from = new Date(NOW_DATE.getFullYear(), NOW_DATE.getMonth(), NOW_DATE.getDate());
    var to   = new Date(NOW_DATE.getFullYear(), NOW_DATE.getMonth(), NOW_DATE.getDate() + 28);
    CALS.forEach(function(c){
      calState[c.name] = { err:null, events:[] };
      calUnsubs.push(mcp.watchTool("Google Calendar", "list_events", {
        calendarId: c.id,
        startTime: keyOf(from) + "T00:00:00+09:00",
        endTime:   keyOf(to)   + "T23:59:59+09:00",
        orderBy: "startTime",
        pageSize: 25
      }, function(e){
        if (e.type === "error"){
          calState[c.name].err = e.error;
          // 일시적인 오류면 이미 받아둔 목록은 그대로 두고, 권한 문제면 지웁니다
          var hard = { needs_reauth:1, server_not_connected:1, blocked_by_policy:1, approval_required:1, not_in_manifest:1 };
          if (hard[e.error && e.error.code]) calState[c.name].events = [];
        } else {
          var pl = e.result && e.result.payload;
          calState[c.name] = { err:null, events:(pl && pl.events) || [] };
        }
        renderCal();
      }, { refetchInterval: 600000 }));
    });
  }

  function startCals(){
    calUnsubs.forEach(function(u){ try { u(); } catch(e){} });
    calUnsubs = []; calState = {}; todoState = {};
    if (!mcpRef){ renderTodo(); return; }
    initCal(mcpRef); initTodoCals(mcpRef);
    renderTodo();
  }

  if (window.claude && window.claude.use){
    window.claude.use("mcp").then(function(mcp){ if (mcp){ mcpRef = mcp; startCals(); } }).catch(function(){});
  }

  // 서버 저장소가 있으면 연결해서 폰·노트북이 같은 기록을 보게 함
  if (window.claude && window.claude.use){
    window.claude.use("db").then(function(store){
      if (!store) return;
      db = store;
      $("#sync").classList.add("ok");
      $("#syncText").textContent = "기기 간 동기화 중";

      subscribeDay();
      refreshWeek();
    }).catch(function(){});
  }
})();
</script>
